/* ── SCROLL FEATURES INIT ─────────── */
function initEnhancements() {
  const main = document.getElementById('main');
  const progBar = document.getElementById('progBar');
  const backTop = document.getElementById('backTop');
  const toc = document.getElementById('toc');
  const jokeFloat = document.getElementById('jokeFloat');
  const jokeEra = document.getElementById('jokeEra');
  const jokeText = document.getElementById('jokeText');
  const jokeMnem = document.getElementById('jokeMnem');

  let jokesOn = isJokesOn();
  let currentJokeEra = '';
  jokeFloat.style.display = jokesOn ? '' : 'none';

  // Build TOC labels
  const tocShort = {medieval:'Medieval',renaissance:'Renaissance',reformation:'Reformation',absolutism:'Absolutism',enlightenment:'Enlighten.',industrial:'Industrial',worldwars:'World Wars',coldwar:'Cold War'};
  ERAS.forEach((era, i) => {
    const dot = document.createElement('div');
    dot.className = 'toc-dot';
    dot.dataset.era = era.id;
    dot.innerHTML = `<span class="toc-color" style="background:${era.color}"></span>${tocShort[era.id]||era.id}`;
    dot.onclick = () => {
      const el = document.getElementById('era-' + era.id);
      if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
    };
    toc.appendChild(dot);
  });

  // Scroll listener — uses offsetTop relative to the scrollable .main container
  function onScroll() {
    const scrollTop = main.scrollTop;
    const scrollH = main.scrollHeight - main.clientHeight;
    const pct = scrollH > 0 ? (scrollTop / scrollH) * 100 : 0;

    progBar.style.width = pct + '%';
    backTop.classList.toggle('show', scrollTop > 300);

    // Find which era is currently visible
    // The active era is the LAST one whose top edge has scrolled above
    // the upper portion of the viewport. No break — check all eras every time.
    let activeEra = ERAS[0].id;
    const mainTop = main.getBoundingClientRect().top;
    for (let i = 0; i < ERAS.length; i++) {
      const el = document.getElementById('era-' + ERAS[i].id);
      if (!el) continue;
      if (el.getBoundingClientRect().top <= mainTop + 150) activeEra = ERAS[i].id;
    }
    toc.querySelectorAll('.toc-dot').forEach(d => d.classList.toggle('active', d.dataset.era === activeEra));

    // Update joke when era changes
    if (jokesOn && activeEra && activeEra !== currentJokeEra) {
      currentJokeEra = activeEra;
      const eraJokes = JOKES.filter(j => j.era === activeEra);
      if (eraJokes.length) {
        const j = eraJokes[Math.floor(Math.random() * eraJokes.length)];
        const eraObj = ERAS.find(e => e.id === activeEra);
        jokeEra.textContent = eraObj ? eraObj.title : activeEra;
        jokeText.innerHTML = j.joke;
        jokeMnem.textContent = j.mnemonic;
        jokeFloat.style.display = '';
      }
    }
  }
  main.addEventListener('scroll', onScroll, {passive:true});
  // Trigger after DOM is fully painted (double-rAF ensures layout is complete)
  requestAnimationFrame(() => { requestAnimationFrame(() => { onScroll(); }); });

  backTop.onclick = () => main.scrollTo({top:0,behavior:'smooth'});

  // Jokes toggle
  document.getElementById('btnJokes').onclick = function() {
    jokesOn = !jokesOn;
    try { localStorage.setItem('euroJokes', jokesOn ? 'on' : 'off'); } catch(e) {}
    this.textContent = jokesOn ? 'Humor: ON' : 'Humor: OFF';
    this.style.opacity = jokesOn ? '1' : '0.5';
    jokeFloat.style.display = jokesOn ? '' : 'none';
    currentJokeEra = '';
    if (currentView === 'study') renderStudy();
  };
  if (!jokesOn) {
    document.getElementById('btnJokes').textContent = 'Humor: OFF';
    document.getElementById('btnJokes').style.opacity = '0.5';
  }
}

async function init() {
  try {
    const resp = await fetch('timeline_data.json');
    DATA = await resp.json();
  } catch(e) {
    document.getElementById('ld').innerHTML = '<div style="color:var(--tier1)">Failed to load data.</div>';
    return;
  }
  document.getElementById('ld').style.display = 'none';
  document.getElementById('searchIco').innerHTML = IC.search;

  // Build chips
  const chipBox = document.getElementById('chips');
  chipBox.innerHTML = CHIPS.map(l => `<button class="chip" data-j="${l}">${l}</button>`).join('');
  chipBox.querySelectorAll('.chip').forEach(ch => {
    ch.onclick = () => {
      document.getElementById('si').value = ch.dataset.j;
      searchTerm = ch.dataset.j;
      if (currentView === 'study') renderStudy();
      else switchView('study');
    };
  });

  // Nav
  document.querySelectorAll('.nb[data-v]').forEach(btn => { btn.onclick = () => switchView(btn.dataset.v); });

  // Unit filter
  document.querySelectorAll('.ub[data-unit]').forEach(btn => {
    btn.onclick = () => {
      const u = parseInt(btn.dataset.unit);
      if (currentUnit === u) { currentUnit = 0; } else { currentUnit = u; }
      document.querySelectorAll('.ub[data-unit]').forEach(b => b.classList.toggle('on', parseInt(b.dataset.unit) === currentUnit));
      document.getElementById('unitClear').style.display = currentUnit ? '' : 'none';
      if (currentView === 'study') { renderStudy(); collapseBySearch(); }
      else if (currentView === 'tables') renderTables();
      else switchView('study');
    };
  });
  document.getElementById('unitClear').onclick = () => {
    currentUnit = 0;
    document.querySelectorAll('.ub[data-unit]').forEach(b => b.classList.remove('on'));
    document.getElementById('unitClear').style.display = 'none';
    if (currentView === 'study') { renderStudy(); collapseBySearch(); }
    else if (currentView === 'tables') renderTables();
  };

  // Search
  document.getElementById('si').addEventListener('input', handleSearch);

  // Detail
  document.getElementById('dpX').onclick = closeDetail;
  document.getElementById('dbk').onclick = closeDetail;

  // Theme (persist preference)
  try {
    const savedTheme = localStorage.getItem('euroTheme');
    if (savedTheme) {
      document.documentElement.dataset.theme = savedTheme;
      document.getElementById('btnTheme').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';
    }
  } catch(e) {}
  document.getElementById('btnTheme').onclick = () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
    document.getElementById('btnTheme').textContent = isDark ? 'Dark' : 'Light';
    try { localStorage.setItem('euroTheme', isDark ? 'light' : 'dark'); } catch(e) {}
  };

  // Search bar collapse toggle
  document.getElementById('srchToggle').onclick = () => {
    const bar = document.getElementById('srchBar');
    const label = document.getElementById('srchToggleLabel');
    bar.classList.toggle('collapsed');
    label.textContent = bar.classList.contains('collapsed') ? 'Search' : 'Hide';
  };

  // Expand / Collapse All
  document.getElementById('btnExpandAll').onclick = () => {
    const btn = document.getElementById('btnExpandAll');
    const expanding = btn.textContent === 'Expand All';
    document.querySelectorAll('.era-hdr').forEach(hdr => {
      hdr.classList.toggle('collapsed', !expanding);
      hdr.nextElementSibling.classList.toggle('collapsed', !expanding);
    });
    document.querySelectorAll('.main details').forEach(d => { d.open = expanding; });
    btn.textContent = expanding ? 'Collapse All' : 'Expand All';
  };

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') { e.target.blur(); searchTerm = ''; } return; }
    if (e.key === '/') { e.preventDefault(); document.getElementById('si').focus(); }
    else if (e.key === 'Escape') closeDetail();
  });

  // Render
  renderStudy();
  document.getElementById('main').scrollTop = 0;
  initEnhancements();
}

init();
</script>
<script src="/euro/euro-ai-chat.js"></script>
<script src="/euro/euro-sounds.js"></script>
</body>
</html>
