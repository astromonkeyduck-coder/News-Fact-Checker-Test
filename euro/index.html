<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP European History Master Timeline | Noteworthy News</title>
<meta name="description" content="Interactive AP European History master study system. Scroll through 700+ items across 9 AP units with events, works, paintings, wars, treaties, thinkers, leaders, and exam prep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{--font-ui:'Inter',system-ui,sans-serif;--font-serif:'Source Serif 4',Georgia,serif;
--unit1:#9B6B2F;--unit2:#C06030;--unit3:#A63C3C;--unit4:#2E7D7D;--unit5:#993333;
--unit6:#4A6F94;--unit7:#6B8040;--unit8:#556070;--unit9:#7A5FA0;
--tier1:#C05020;--tier2:#B08020;--tier3:#708090;
--radius:10px}
[data-theme="light"]{--bg:#F8F6F1;--bg2:#EFEDE6;--bgE:#FFFFFF;--bgC:#FFFFFF;--bgS:#F3F1EA;
--tx:#1C1C1C;--tx2:#3D3D3D;--txM:#7A7A7A;--bdr:#DDD9CE;--bdrH:#C8C4BA;
--acc:#1D5BA0;--accM:rgba(29,91,160,0.07);--accL:#EBF0F8;
--sh1:0 1px 4px rgba(0,0,0,0.05);--sh2:0 4px 12px rgba(0,0,0,0.08);--sh3:0 8px 30px rgba(0,0,0,0.1)}
[data-theme="dark"]{--bg:#0C1422;--bg2:#111C2E;--bgE:#182640;--bgC:#1A2A44;--bgS:#131F33;
--tx:rgba(240,242,245,0.92);--tx2:rgba(240,242,245,0.65);--txM:rgba(240,242,245,0.35);
--bdr:rgba(240,242,245,0.08);--bdrH:rgba(240,242,245,0.15);
--acc:#6BA3F5;--accM:rgba(107,163,245,0.1);--accL:rgba(107,163,245,0.06);
--sh1:0 1px 4px rgba(0,0,0,0.3);--sh2:0 4px 12px rgba(0,0,0,0.3);--sh3:0 8px 30px rgba(0,0,0,0.4)}
body{font-family:var(--font-ui);background:var(--bg);color:var(--tx);line-height:1.6;min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}

/* ── App Shell ────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:var(--bgE);border-bottom:1px solid var(--bdr);flex-shrink:0;z-index:100}
.hdr h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.hdr .sub{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:0.12em;text-transform:uppercase;background:var(--accL);padding:3px 10px;border-radius:20px}
.hdr-r{display:flex;align-items:center;gap:8px}

.nav{display:flex;align-items:center;gap:6px;padding:10px 28px;background:var(--bg2);border-bottom:1px solid var(--bdr);flex-shrink:0;z-index:90;flex-wrap:wrap}
.nb{padding:8px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;background:transparent;border:1px solid transparent;transition:all .2s;white-space:nowrap;color:var(--tx2)}
.nb:hover{background:var(--accM);color:var(--tx);border-color:var(--bdr)}
.nb.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px rgba(29,91,160,0.25)}
.nsep{width:1px;height:22px;background:var(--bdr);margin:0 4px}

.srch{display:flex;align-items:center;gap:10px;padding:10px 28px;background:var(--bg);border-bottom:1px solid var(--bdr);flex-shrink:0;flex-wrap:wrap;transition:all .2s ease}
.srch.collapsed .sbox,.srch.collapsed .chips{display:none}
.srch.collapsed{padding:6px 28px;gap:6px}
.srch-toggle{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius);font-size:11px;font-weight:600;background:var(--bgE);border:1px solid var(--bdr);cursor:pointer;color:var(--tx2);transition:all .15s;white-space:nowrap}
.srch-toggle:hover{border-color:var(--acc);color:var(--acc)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--bgE);border:1.5px solid var(--bdr);border-radius:var(--radius);padding:0 14px;flex:0 1 320px;transition:border-color .2s}
.sbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accM)}
.sbox input{background:none;border:none;outline:none;font-size:14px;padding:10px 0;width:100%;color:var(--tx)}
.sbox input::placeholder{color:var(--txM)}
.chips{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bgE);border:1px solid var(--bdr);cursor:pointer;transition:all .2s;white-space:nowrap;color:var(--tx2)}
.chip:hover{border-color:var(--acc);color:var(--acc);background:var(--accL)}

.unit-nav{display:flex;align-items:center;gap:4px;padding:6px 28px;background:var(--bg);border-bottom:1px solid var(--bdr);flex-shrink:0}
.ub{width:30px;height:28px;border-radius:6px;font-size:12px;font-weight:700;border:1.5px solid var(--bdr);background:var(--bgE);color:var(--tx2);cursor:pointer;transition:all .15s}
.ub:hover{border-color:var(--uc);color:var(--uc);background:color-mix(in srgb,var(--uc) 8%,transparent)}
.ub.on{background:var(--uc);color:#fff;border-color:var(--uc)}
.ub-clear{width:auto;padding:0 10px;font-size:10px;color:var(--txM);border-color:transparent;background:transparent}
.ub-clear:hover{color:var(--tx);text-decoration:underline}
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:none;padding:28px;max-width:1200px;margin:0 auto}
.view.on{display:block}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;background:var(--bgE);border:1px solid var(--bdr);transition:all .2s;cursor:pointer;color:var(--tx2)}
.btn:hover{background:var(--accL);border-color:var(--acc);color:var(--acc)}

/* ── Era Sections ─────────────────────── */
.era-sec{margin-bottom:32px;border:1px solid var(--bdr);border-radius:16px;overflow:hidden;background:var(--bgC);box-shadow:var(--sh1)}
.era-hdr{padding:18px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .2s}
.era-hdr:hover{background:var(--accM)}
.era-hdr h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;line-height:1.3}
.era-hdr .era-badge{font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;color:#fff;letter-spacing:.02em}
.era-hdr .era-toggle{font-size:16px;color:var(--txM);transition:transform .25s ease}
.era-hdr.collapsed .era-toggle{transform:rotate(-90deg)}
.era-body{padding:0 24px 20px}
.era-body.collapsed{display:none}

/* ── Narrative Block ──────────────────── */
.era-summary{font-size:14px;color:var(--tx2);line-height:1.8;font-family:var(--font-serif);margin-bottom:20px;padding:16px 20px;background:var(--accL);border-radius:var(--radius);border:1px solid var(--bdr)}
.era-summary b{color:var(--acc);font-family:var(--font-ui);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:inline-block;margin-top:4px}

/* ── Stage Progressions ───────────────── */
.stage-row{display:flex;gap:2px;border-radius:8px;overflow:hidden;margin-bottom:10px}
.stage-seg{flex:1;padding:10px 6px;font-size:10px;font-weight:600;color:#fff;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px}
.stage-title{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--tx)}

/* ── Sub-sections ─────────────────────── */
.sub-sec{margin-bottom:20px}
.sub-sec h3{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:10px;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--bdr)}
.sub-sec h3 .ico{display:inline-flex;align-items:center;color:var(--acc);flex-shrink:0}
.sub-sec h3 .ico svg{width:16px;height:16px}

/* ── Event Cards ──────────────────────── */
.ec{border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:all .2s;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;border:1px solid var(--bdr);border-left:5px solid var(--ec-color,#888)}
.ec:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.ec .ct{display:flex;align-items:center;gap:6px}
.ec .cd{font-size:11px;font-weight:700;white-space:nowrap}
.ec .cti{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:auto;flex-shrink:0}
.ec .cn{font-size:13px;font-weight:600;line-height:1.35}
.ec .unit-label{font-size:9px;font-weight:700;padding:2px 8px;border-radius:12px;color:#fff}
.ec.t1 .cti{background:rgba(192,80,32,0.12);color:var(--tier1)}
.ec.t2 .cti{background:rgba(176,128,32,0.12);color:var(--tier2)}
.ec.t3{opacity:.85}.ec.t3 .cti{background:rgba(112,128,144,0.12);color:var(--tier3)}

/* Inline expanded card */
.ec .ec-detail{display:none;padding:10px 0 4px;border-top:1px solid var(--bdr);margin-top:6px;font-size:12px;color:var(--tx2);line-height:1.6}
.ec.expanded .ec-detail{display:block}
.ec.expanded{box-shadow:var(--sh2);z-index:2;border-color:var(--acc)}
.ec .ec-detail h5{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin:8px 0 3px}
.ec .ec-detail h5:first-child{margin-top:0}
.ec .ec-detail p{margin-bottom:4px}
.ec .ec-detail ul{list-style:none;padding:0;margin:0 0 6px}
.ec .ec-detail li{padding:2px 0 2px 12px;position:relative;font-size:12px}
.ec .ec-detail li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.ec .ec-detail .ec-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.ec .ec-detail .ec-tag{padding:2px 7px;border-radius:12px;font-size:10px;font-weight:600;background:var(--bgS);border:1px solid var(--bdr)}

/* ── Content Cards ────────────────────── */
.cc{background:var(--bgS);border:1px solid var(--bdr);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.5;transition:box-shadow .2s}
.cc:hover{box-shadow:var(--sh1)}
.cc .cc-title{font-weight:700;color:var(--tx);font-size:14px}
.cc .cc-meta{font-size:11px;color:var(--acc);font-weight:600;margin-top:2px}
.cc .cc-desc{color:var(--tx2);margin-top:4px;font-size:12px;line-height:1.5}

/* ── Mini Entries ─────────────────────── */
.mini{padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px;display:flex;gap:8px;align-items:baseline}
.mini:last-child{border-bottom:none}
.mini .m-name{font-weight:700;white-space:nowrap}
.mini .m-dates{font-size:11px;color:var(--acc);font-weight:600;white-space:nowrap}
.mini .m-note{color:var(--tx2);font-size:12px}

/* ── Grids ────────────────────────────── */
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.glist{display:flex;flex-direction:column;gap:4px}

/* ── Exam Prep ─────────────────────────── */
.ep-sec{margin-bottom:28px;padding:20px 24px;background:var(--bgC);border:1px solid var(--bdr);border-radius:16px;box-shadow:var(--sh1)}
.ep-sec h2{font-size:20px;font-weight:800;margin-bottom:12px}
.ep-sec h3{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--acc)}
.chain-flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-bottom:12px;padding:8px 0}
.chain-node{padding:8px 14px;background:var(--bgS);border:1.5px solid var(--bdr);border-radius:var(--radius);font-size:12px;font-weight:600;max-width:200px;transition:all .2s}
.chain-node:hover{border-color:var(--acc);box-shadow:var(--sh1)}
.chain-conn{padding:0 4px;color:var(--acc);font-size:18px;font-weight:800;flex-shrink:0}
.cmp-card{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;padding:16px;background:var(--bgC);border:1px solid var(--bdr);border-radius:var(--radius);margin-bottom:10px;align-items:start;transition:box-shadow .2s}
.cmp-card:hover{box-shadow:var(--sh1)}
.cmp-side h4{font-size:14px;font-weight:700;margin-bottom:4px}
.cmp-side p{font-size:12px;color:var(--tx2);line-height:1.5}
.cmp-vs{font-size:16px;font-weight:800;color:var(--acc);align-self:center;padding:4px 10px;background:var(--accL);border-radius:var(--radius)}
.ccot-card{padding:16px;background:var(--bgC);border:1px solid var(--bdr);border-radius:var(--radius);margin-bottom:10px}
.ccot-card h3{margin-bottom:8px;font-size:15px}
.ccot-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ccot-col h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.ccot-col.chg h4{color:var(--tier1)}.ccot-col.cnt h4{color:var(--unit4)}
.ccot-col li{font-size:12px;color:var(--tx2);padding:3px 0 3px 14px;position:relative;list-style:none;line-height:1.5}
.ccot-col li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%}
.ccot-col.chg li::before{background:var(--tier1)}.ccot-col.cnt li::before{background:var(--unit4)}
.dbq-period{margin-bottom:24px;padding:20px;background:var(--bgC);border:1px solid var(--bdr);border-radius:16px;box-shadow:var(--sh1)}
.dbq-period h3{font-size:17px;font-weight:700;margin-bottom:12px}
.ev-item{padding:8px 12px;background:var(--bgS);border-radius:8px;font-size:12px;margin-bottom:5px;line-height:1.5}
.cx-box{margin-top:14px;padding:14px;background:var(--accL);border:1px solid rgba(29,91,160,0.15);border-radius:var(--radius)}
.cx-box h4{font-size:11px;font-weight:700;color:var(--acc);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
.cx-box li{font-size:12px;color:var(--tx2);padding:3px 0 3px 14px;position:relative;list-style:none;line-height:1.5}
.cx-box li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--acc)}

/* ── Tables ────────────────────────────── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--bdr)}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{position:sticky;top:0;z-index:3;background:var(--bg2);padding:10px 12px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--txM);border-bottom:2px solid var(--bdr);cursor:pointer;white-space:nowrap;user-select:none}
.dtbl th:hover{color:var(--acc)}
.dtbl td{padding:8px 12px;border-bottom:1px solid var(--bdr);vertical-align:top}
.dtbl tr{cursor:pointer;transition:background .15s}.dtbl tr:hover td{background:var(--accL)}

/* ── Detail Panel ──────────────────────── */
.dbk{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,0.4);display:none;backdrop-filter:blur(4px)}
.dbk.open{display:block}
.dp{position:fixed;right:0;top:0;bottom:0;width:460px;max-width:100%;background:var(--bgE);border-left:1px solid var(--bdr);z-index:200;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 30px rgba(0,0,0,0.15)}
.dp.open{transform:translateX(0)}
.dp-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.dp-hdr h2{font-size:18px;font-weight:800;line-height:1.3}
.dp-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);font-size:18px;background:var(--bgS);flex-shrink:0;cursor:pointer;transition:background .15s}
.dp-close:hover{background:var(--bdr)}
.dp-body{flex:1;overflow-y:auto;padding:20px 24px}
.ds{margin-bottom:18px}
.ds h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--acc);margin-bottom:6px}
.ds p{font-size:13px;color:var(--tx2);line-height:1.7}
.ds ul{list-style:none;padding:0}
.ds li{font-size:13px;color:var(--tx2);line-height:1.6;padding:3px 0 3px 16px;position:relative}
.ds li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.dtags{display:flex;flex-wrap:wrap;gap:4px}
.dtag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bgS);border:1px solid var(--bdr)}
.dbdg{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.exc{padding:6px 8px;border-radius:6px;font-size:11px;font-weight:600;text-align:center}
.exc.y{background:var(--accL);color:var(--acc);border:1px solid rgba(29,91,160,0.2)}
.exc.n{background:var(--bgS);color:var(--txM);border:1px solid var(--bdr)}

/* ── Cram View ─────────────────────────── */
.cram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cram-item{padding:8px 12px;background:var(--bgC);border:1px solid var(--bdr);border-radius:var(--radius);font-size:12px;display:flex;gap:6px;transition:box-shadow .2s}
.cram-item:hover{box-shadow:var(--sh1)}
.cram-item .cr-d{font-weight:700;color:var(--acc);white-space:nowrap;flex-shrink:0}
.cram-item .cr-t{font-weight:600}

/* ── Details/Summary ───────────────────── */
details{border-radius:var(--radius)}
details summary{padding:8px 0;font-size:12px;font-weight:600;cursor:pointer;color:var(--acc);transition:color .15s}
details summary:hover{color:var(--tx)}
details[open] summary{margin-bottom:8px}

/* Print */
@media print{body{background:#fff!important;color:#111!important;font-size:8pt!important}
.hdr,.nav,.srch,.dp,.dbk,.hdr-r,#spotifyPlayer,.toc,.back-top,.prog-bar,.joke-float{display:none!important}
.main{overflow:visible!important}.view{padding:6px!important}
.ec,.cc{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important}
.era-sec{break-inside:avoid}@page{size:landscape;margin:.5cm}}

/* Responsive */
@media(max-width:768px){.dp{width:100%}.g2{grid-template-columns:1fr}.chips{display:none}
.nav{overflow-x:auto;flex-wrap:nowrap}.cmp-card{grid-template-columns:1fr}.cmp-vs{text-align:center}
.hdr{flex-wrap:wrap;padding:8px 12px;gap:6px}.hdr h1{font-size:15px;width:100%}
.hdr-r{width:100%;justify-content:flex-start;flex-wrap:wrap;gap:4px}
.hdr-r .btn{padding:5px 10px;font-size:11px}
.view{padding:12px}
.unit-nav{padding:6px 12px;overflow-x:auto;flex-wrap:nowrap}
.era-body{padding:0 12px 12px}.era-hdr{padding:12px 14px}
.ccot-grid{grid-template-columns:1fr}}

/* Accessibility */
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px}
.spinner{width:24px;height:24px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(1deg)}}

/* ── Progress bar ──────────────────── */
.prog-bar{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:999;transition:width .1s;border-radius:0 2px 2px 0}

/* ── Back to top ───────────────────── */
.back-top{position:fixed;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:var(--sh2);cursor:pointer;z-index:90;transition:all .2s;border:none;font-size:18px}
.back-top:hover{transform:scale(1.1);box-shadow:var(--sh3)}
.back-top.show{display:flex}

/* ── Sticky mini TOC ───────────────── */
.toc{position:fixed;left:6px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:3px;background:var(--bgC);border:1px solid var(--bdr);border-radius:12px;padding:8px 6px;box-shadow:var(--sh2)}
.toc-dot{width:auto;padding:4px 8px;border-radius:8px;border:none;background:transparent;cursor:pointer;transition:all .2s;position:relative;font-size:10px;font-weight:700;color:var(--txM);white-space:nowrap;text-align:left}
.toc-dot:hover{background:var(--accM);color:var(--acc)}
.toc-dot.active{background:var(--acc);color:#fff}
.toc-dot .toc-color{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
@media(max-width:1100px){.toc{display:none}}

/* ── Study progress ────────────────── */
.era-check{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 12px;background:var(--bgS);border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:600;color:var(--tx2);transition:all .15s;user-select:none;border:1px solid var(--bdr)}
.era-check:hover{border-color:var(--acc)}
.era-check.done{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.3);color:#16a34a}
.era-check svg{width:16px;height:16px;flex-shrink:0}
.study-bar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin:8px 0}
.study-bar-fill{height:100%;background:linear-gradient(90deg,var(--acc),#22c55e);border-radius:3px;transition:width .4s ease}

/* ── Joke sidebar ──────────────────── */
.joke-float{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:220px;z-index:70;transition:all .3s}
.joke-card{background:var(--bgC);border:1px solid var(--bdr);border-radius:12px;padding:14px;box-shadow:var(--sh2);font-size:12px;line-height:1.5}
.joke-card .joke-era{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin-bottom:4px}
.joke-card .joke-text{color:var(--tx2)}
.joke-card .joke-mnemonic{margin-top:6px;padding-top:6px;border-top:1px solid var(--bdr);font-weight:600;color:var(--tx);font-size:11px}
@media(max-width:1200px){.joke-float{display:none}}

/* ── Visual polish ─────────────────── */
.hero-area{background:linear-gradient(135deg,var(--accL) 0%,var(--bg) 60%);border-radius:0 0 24px 24px;padding:28px 0 32px;margin:-28px -28px 28px;text-align:center}
.hero-area img{border-radius:50%;border:3px solid var(--bgE);animation:heroFloat 4s ease-in-out infinite}
.era-hdr{border-left:4px solid transparent}
.sub-sec h3{background:none;border-bottom:2px solid var(--bdr);border-radius:0;margin-bottom:12px}
@media(min-width:1024px){body{font-size:15px}.view{padding:28px 32px}}
.ec.expanded{box-shadow:0 0 0 2px var(--acc),var(--sh2)}
</style>

const UN=['','Unit 1: Renaissance & Exploration','Unit 2: Age of Reformation','Unit 3: Absolutism & Constitutionalism','Unit 4: Scientific & Philosophical','Unit 5: Conflict, Crisis & Reaction','Unit 6: Industrialization','Unit 7: 19th-Century Perspectives','Unit 8: 20th-Century Global Conflicts','Unit 9: Cold War & Contemporary'];

const ERAS = [
  {id:'medieval',title:'Late Medieval Transition',range:'c. 1300–1450',color:'#7A6840',start:1300,end:1450,
   summary:`<b>POLITICAL:</b> The Hundred Years' War (1337–1453) between England and France weakened feudal nobility, strengthened national monarchies, fostered national identity, and introduced new military technology (the longbow at Crécy and Agincourt undermined mounted knights, signaling the decline of feudal warfare). The Wars of the Roses in England ended feudal chaos and produced the Tudor dynasty. Centralized "new monarchies" began emerging.<br><br><b>SOCIAL:</b> The Black Death (1347–51) killed roughly one-third of Europe's population, creating severe labor shortages. Surviving peasants demanded higher wages and freedom from serfdom — serfdom declined in Western Europe but intensified in Eastern Europe (a divergence with lasting consequences). Flagellant movements and pogroms against Jews reflected the psychological trauma. The old feudal social order was cracking.<br><br><b>RELIGIOUS:</b> The Avignon Papacy ("Babylonian Captivity," 1305–1378) and the Great Schism (1378–1417, with two or three rival popes) devastated papal prestige. The conciliar movement (Council of Constance, 1414–18) tried and failed to reform the Church from within. Jan Hus was burned as a heretic. The institutional Church's corruption — simony, absenteeism, pluralism — created the conditions that would make the Reformation possible a century later.<br><br><b>INTELLECTUAL:</b> Early humanism emerged with Petrarch (1304–74) promoting the study of classical Latin texts, and Boccaccio's <i>Decameron</i> exploring human experience during the plague. Christine de Pizan defended women's intellectual capacity. Dante's <i>Divine Comedy</i> elevated vernacular Italian. These literary developments planted the seeds for the full Renaissance.<br><br><b>ECONOMIC:</b> The Black Death disrupted trade networks but also created opportunities: labor scarcity raised wages, shifted bargaining power to peasants, and accelerated the transition from feudal obligations to cash-based relationships. Long-distance trade (Hanseatic League, Italian city-states) continued despite disruption.<br><br><b>CONNECTIONS →</b> Everything here sets up the Renaissance and Reformation: papal corruption → Reformation; feudal decline → new monarchies → absolutism; Black Death labor changes → commercial revolution; early humanism → full Renaissance humanism.`},
  {id:'renaissance',title:'Renaissance & Exploration',range:'c. 1450–1600',color:'#9B6B2F',start:1450,end:1600,
   summary:`<b>INTELLECTUAL:</b> Humanism — the revival of classical Greek and Roman learning — transformed education, politics, and culture. Petrarch, Erasmus, and Thomas More emphasized human agency, critical textual analysis (<i>ad fontes</i> — back to the sources), and civic virtue. Machiavelli's <i>The Prince</i> (1513) introduced secular political realism. The printing press (Gutenberg, c. 1456) was the single most consequential innovation: it spread literacy beyond clergy, enabled rapid circulation of ideas, and made censorship nearly impossible. Without print, neither the Reformation nor the Scientific Revolution could have unfolded as they did.<br><br><b>ARTISTIC/CULTURAL:</b> Italian Renaissance artists (Leonardo, Michelangelo, Raphael, Botticelli) pioneered perspective, anatomical realism, and individual expression, funded by wealthy patrons (Medici, popes). Northern Renaissance artists (van Eyck, Dürer, Bruegel) emphasized meticulous detail, oil painting, domestic subjects, and sharper social commentary. <b>KEY COMPARISON:</b> Italian = idealized, classical, grand, secular. Northern = detailed, realistic, religious/domestic, socially critical.<br><br><b>POLITICAL:</b> New Monarchies — Ferdinand & Isabella (Spain), Henry VII (England), Louis XI (France) — consolidated royal power over feudal nobility and the Church. They built professional bureaucracies, standing armies, and national tax systems, laying the groundwork for absolutism. Charles V's vast Habsburg empire was the last attempt at universal Christian monarchy.<br><br><b>ECONOMIC:</b> The Commercial Revolution transformed European economies: joint-stock companies (Dutch East India Co.), banking houses (Medici, Fuggers), mercantilism, and New World silver created a new commercial capitalism. The Price Revolution (sustained inflation from silver influx + population growth) destabilized traditional social hierarchies — merchants grew wealthy while fixed-income nobles declined.<br><br><b>GEOGRAPHIC/GLOBAL (INT):</b> Portuguese navigators (Henry the Navigator, Dias, da Gama) pioneered Atlantic and Indian Ocean routes. Columbus's 1492 voyage opened the Americas. The Columbian Exchange reshuffled global ecology: crops crossed oceans (potatoes, maize → Europe; horses, wheat → Americas), but European diseases devastated indigenous populations. The Atlantic slave trade began. Treaty of Tordesillas (1494) divided the non-Christian world between Spain and Portugal — demonstrating European assumptions of global dominance.<br><br><b>CONNECTIONS →</b> Humanism + print → Reformation (Unit 2). New monarchies → absolutism (Unit 3). Exploration + commercial capitalism → industrialization (Unit 6). This era defines the start of the AP Euro course.`},
  {id:'reformation',title:'Reformation & Religious Wars',range:'c. 1517–1648',color:'#C06030',start:1517,end:1648,
   summary:`<b>RELIGIOUS:</b> Martin Luther's 95 Theses (1517) challenged indulgences, but his deeper theology — justification by faith alone (<i>sola fide</i>), scripture alone (<i>sola scriptura</i>), the priesthood of all believers — struck at the institutional foundations of the Catholic Church. The printing press spread his ideas across Germany within weeks. Calvin developed Reformed theology in Geneva (predestination, theocratic community). Henry VIII's break with Rome (1534) was dynastic, not theological. The Catholic/Counter-Reformation responded: the Council of Trent (1545–63) clarified doctrine, the Jesuits (founded 1540) became the Church's intellectual vanguard, and the Inquisition intensified.<br><br><b>POLITICAL:</b> Princes used the Reformation to seize Church lands and assert independence from Rome. Cuius regio, eius religio (Peace of Augsburg, 1555) — the ruler determines religion — institutionalized the link between religion and state power. The Thirty Years' War (1618–48) began as a religious conflict but became a power struggle involving most of Europe. The Peace of Westphalia (1648) established the sovereign state system — the foundation of modern international relations.<br><br><b>SOCIAL:</b> Peasants invoked "Christian liberty" to demand social justice (German Peasants' War, 1524–25), but Luther sided with the princes and the revolt was crushed. Women's roles were ambiguous: Protestant emphasis on marriage could empower or confine. Religious minorities faced persecution on all sides. St. Bartholomew's Day Massacre (1572) killed thousands of Huguenots in France.<br><br><b>ECONOMIC:</b> Confiscation of Church lands enriched Protestant princes and monarchs. The Dutch Revolt against Catholic Spain combined Calvinist identity with commercial ambition, producing the Dutch Golden Age. Mercantilism linked state power to trade control.<br><br><b>GEOGRAPHIC:</b> Religious division mapped onto geography: Protestant north (Scandinavia, northern Germany, Netherlands, England, Scotland) vs. Catholic south (Spain, Italy, France, southern Germany, Poland). This religious geography shaped alliances and conflicts for centuries.<br><br><b>COMPLEXITY:</b> The Reformation cannot be reduced to theology. It was simultaneously about theology, politics, economics, social class, and national identity. Westphalia did not end religious conflict everywhere — persecution continued into the 18th century.<br><br><b>CONNECTIONS →</b> Religious wars convinced rulers strong central authority was needed → absolutism (Unit 3). Cuius regio is a stepping stone to divine right. Print culture → Scientific Revolution → Enlightenment (Unit 4).`},
  {id:'absolutism',title:'Absolutism & Scientific Revolution',range:'c. 1600–1750',color:'#A63C3C',start:1600,end:1750,
   summary:`<b>POLITICAL:</b> After the chaos of the Reformation wars, European states diverged into two models. <b>Absolutism:</b> Louis XIV (r. 1643–1715) centralized power at Versailles, controlled nobles through court culture, revoked the Edict of Nantes (1685), and waged expensive wars. Colbert's mercantilism and the intendant system modernized France. Peter the Great westernized Russia by force. The Hohenzollerns built Prussia's military-bureaucratic state. <b>Constitutionalism:</b> England's Civil War (1642–51), execution of Charles I, Cromwell's Commonwealth, and the Glorious Revolution (1688) produced the Bill of Rights and parliamentary sovereignty. Locke's <i>Two Treatises</i> (1689) provided the theory: government derives legitimacy from consent of the governed. The Dutch Republic — commercial, tolerant, decentralized — was the antithesis of French absolutism.<br><br><b>INTELLECTUAL/SCIENTIFIC:</b> The Scientific Revolution: Copernicus proposed heliocentrism (1543). Kepler refined it with elliptical orbits. Galileo's telescopic observations brought him into conflict with the Church. Bacon championed empiricism (observation); Descartes championed rationalism (reason: "I think, therefore I am"). Newton's <i>Principia</i> (1687) unified physics — a universe governed by discoverable natural laws, not divine whim. Harvey discovered blood circulation. This was not just new knowledge; it was a new way of knowing.<br><br><b>ECONOMIC:</b> Mercantilism — government regulation of trade to maximize exports and gold reserves — was the dominant economic policy. Colonial trade enriched Atlantic states. The Bank of England (1694) created modern public finance. The Commercial Revolution expanded: joint-stock companies, insurance, stock exchanges.<br><br><b>SOCIAL:</b> Serfdom deepened in Eastern Europe as it disappeared in the West — creating divergent social structures. Court culture at Versailles turned nobles into dependents of the king. The Dutch Golden Age showed that commercial prosperity and cultural brilliance could thrive without absolutism.<br><br><b>CONNECTIONS →</b> The Scientific Revolution's new epistemology → Enlightenment (Unit 4). Locke and the Glorious Revolution → American and French Revolutions (Unit 5). Eastern absolutism's serfdom legacy → 19th-century crises (Units 7–9). Louis XIV's wars → French fiscal crisis → Revolution.`},
  {id:'enlightenment',title:'Enlightenment & Revolution',range:'c. 1750–1815',color:'#2E7D7D',start:1750,end:1815,
   summary:`<b>INTELLECTUAL:</b> The Enlightenment applied scientific reasoning to human affairs. Voltaire championed toleration and free speech. Montesquieu proposed separation of powers. Rousseau argued for popular sovereignty and the general will. Diderot's <i>Encyclopédie</i> compiled all human knowledge. Adam Smith's <i>Wealth of Nations</i> (1776) founded classical economics. Beccaria reformed penal theory. Wollstonecraft argued for women's rights. Kant reconciled empiricism and rationalism. Enlightened absolutists (Frederick the Great, Catherine the Great, Joseph II) adopted reformist rhetoric while maintaining autocratic power — revealing the tension between reason and authority.<br><br><b>POLITICAL:</b> The French Revolution (1789) destroyed the Old Regime. Causes: fiscal crisis (debt from wars), social inequality (Three Estates system), Enlightenment critiques, and a weak king. Phases: National Assembly → Declaration of Rights of Man (1789) → radical Jacobins and Terror (1793–94) → Thermidorian Reaction → Directory → Napoleon's coup (1799). Napoleon consolidated revolutionary gains (Napoleonic Code, meritocracy, legal equality) while establishing a military dictatorship. His conquests spread revolutionary principles AND provoked nationalist resistance. Congress of Vienna (1815): Metternich, Castlereagh, and Talleyrand restored conservative order, balance of power, and legitimate monarchies.<br><br><b>SOCIAL:</b> The Revolution proclaimed universal rights — but excluded women (Olympe de Gouges was executed), initially maintained slavery, and unleashed class warfare. The Terror raises enduring questions about revolutionary violence. Partitions of Poland (1772–95) erased an entire nation — great-power cynicism at its worst.<br><br><b>ECONOMIC:</b> The Seven Years' War (1756–63) left France bankrupt — a direct cause of the Revolution. The Continental System (Napoleon's failed economic blockade of Britain) showed the limits of military-economic coercion. Smith's laissez-faire challenged mercantilist orthodoxy.<br><br><b>TECHNOLOGICAL:</b> Watt's improved steam engine (1769) and Kay's flying shuttle (1733) initiated the Industrial Revolution in Britain — the economic transformation that would reshape everything in the next century.<br><br><b>CONNECTIONS →</b> Enlightenment ideas → French Revolution. Napoleon's Code and nationalist awakenings → 19th-century unification movements. Congress of Vienna's suppression → Revolutions of 1830/1848. Economic disruptions → industrialization (Unit 6).`},
  {id:'industrial',title:'Industrialization & Nationalism',range:'c. 1815–1914',color:'#4A6F94',start:1815,end:1914,
   summary:`<b>ECONOMIC/TECHNOLOGICAL:</b> The Industrial Revolution began in Britain (c. 1760): abundant coal/iron, navigable rivers, stable government protecting property, agricultural improvements freeing labor, colonial capital. Key innovations: steam engine (Watt), spinning jenny, railroad (Stephenson), Bessemer steel. Urbanization was rapid and brutal — factory work imposed new disciplines; child labor, dangerous conditions, subsistence wages were widespread. The Second Industrial Revolution (c. 1870–1914): steel, chemicals, electricity, petroleum. Germany and the US challenged British dominance. Consumer culture emerged.<br><br><b>POLITICAL:</b> Three competing ideologies shaped politics. <b>Conservatism</b> (Burke, Metternich): defend tradition, monarchy, gradual reform. <b>Liberalism</b> (Mill, Smith): individual rights, constitutional government, free markets. <b>Socialism</b> (Marx, Engels): capitalism is exploitative; workers must seize the means of production. <b>Nationalism</b> drove unification: Cavour used diplomacy for Italy (1861); Bismarck used "blood and iron" for Germany (1871). <b>KEY COMPARISON:</b> Italian unification = diplomacy + popular uprising. German unification = military force + Realpolitik. Revolutions of 1830 succeeded partially (France, Belgium); 1848 revolutions failed everywhere — discrediting romantic revolution and empowering Realpolitik. Britain avoided revolution through incremental reform (Reform Acts 1832, 1867, 1884).<br><br><b>SOCIAL:</b> New class structure: bourgeoisie (factory owners, professionals) vs. proletariat (industrial workers). Trade unions, Chartism, and labor movements demanded rights. Feminism emerged: Wollstonecraft → Pankhurst suffragettes. Social Darwinism misapplied Darwin to justify racial hierarchy and imperialism.<br><br><b>GLOBAL (INT):</b> New Imperialism (c. 1870–1914): industrialized nations scrambled to colonize Africa and Asia. Motives: economic (raw materials, markets), strategic (rivalries), ideological (Social Darwinism, "civilizing mission"), technological (machine guns, quinine, steamships). Berlin Conference (1884–85) partitioned Africa with no African input. Imperial competition between Britain and Germany was a major cause of WWI.<br><br><b>RELIGIOUS:</b> Secularization accelerated. Darwin's <i>Origin of Species</i> (1859) challenged religious explanations. Bismarck's Kulturkampf targeted Catholic influence. French separation of church and state (1905).<br><br><b>CONNECTIONS →</b> Unresolved tensions — imperial rivalry, nationalist grievances, militarism, alliance systems — are the direct causes of WWI (Unit 8). Socialist and feminist movements bear fruit in Units 8–9. Industrialization's global dimension → Cold War divisions.`},
  {id:'worldwars',title:'World Wars',range:'c. 1914–1945',color:'#556070',start:1914,end:1945,
   summary:`<b>POLITICAL/MILITARY:</b> World War I (1914–18): alliance systems (Triple Alliance vs. Triple Entente) turned a Balkan assassination into continental catastrophe. Trench warfare on the Western Front; new technology (machine guns, poison gas, tanks, aircraft) made war unprecedentedly destructive. 10+ million soldiers died. Four empires collapsed (Ottoman, Austro-Hungarian, Russian, German). The Russian Revolution (1917): February Revolution overthrew the Tsar; October Revolution brought Lenin's Bolsheviks to power → world's first communist state. Treaty of Versailles (1919): war guilt clause, reparations, territorial losses humiliated Germany — too harsh to forgive, too soft to prevent another war.<br><br><b>ECONOMIC:</b> The Great Depression (1929): stock market crash → bank failures → mass unemployment → loss of faith in liberal democracy. Keynesian economics emerged as a response. Weimar hyperinflation (1923) and then Depression destroyed German middle class → Nazi support. Economic nationalism replaced free trade.<br><br><b>POLITICAL (continued):</b> Rise of totalitarianism. <b>Fascist Italy</b> (Mussolini, 1922): authoritarian nationalism, one-party state, but less total control than Nazism. <b>Nazi Germany</b> (Hitler, 1933): totalitarian racial state — Gleichschaltung (total coordination), Nuremberg Laws, aggressive expansion, Holocaust. <b>Stalin's USSR:</b> forced collectivization (Ukraine famine ~5M dead), Five-Year Plans, Great Purge, Gulag system. <b>KEY COMPARISON:</b> Fascism vs. Nazism vs. Stalinism — different ideologies, similar methods of total control. Appeasement (Munich, 1938) failed catastrophically.<br><br><b>SOCIAL:</b> Total war mobilized entire societies — women entered workforce, civilians became targets (bombing, occupation, genocide). The Holocaust: systematic murder of 6 million Jews and millions of others (Roma, disabled, POWs) — the most extreme consequence of centuries of European antisemitism combined with totalitarian state power and industrial efficiency. Spanish Civil War (1936–39) was a proxy conflict for fascism vs. communism.<br><br><b>INTELLECTUAL:</b> The "Age of Anxiety": Freud (unconscious mind), Nietzsche (God is dead), existentialism (Sartre, Camus), and cultural modernism reflected disillusionment with Enlightenment faith in reason and progress. Art movements — Expressionism, Cubism, Dadaism, Surrealism — expressed the fragmentation and horror of modern experience.<br><br><b>CONNECTIONS →</b> WWII's destruction → Cold War division (Unit 9). Holocaust → human rights movement, creation of Israel. Decolonization accelerates as weakened European empires cannot hold colonies. War experience → welfare states.`},
  {id:'coldwar',title:'Cold War & Contemporary',range:'c. 1945–present',color:'#7A5FA0',start:1945,end:2026,
   summary:`<b>POLITICAL:</b> Cold War (1947–91): ideological rivalry between US-led capitalist West and Soviet-led communist East divided Europe. Truman Doctrine (1947) and Marshall Plan (1948) committed the US to containment and reconstruction. NATO (1949) vs. Warsaw Pact (1955). Berlin Wall (1961–89) physically embodied the Iron Curtain. Key crises: Berlin Blockade (1948), Hungarian Revolution (1956), Prague Spring (1968). Détente eased tensions temporarily (Helsinki Accords, 1975). Gorbachev's glasnost/perestroika → Fall of Berlin Wall (1989) → Soviet dissolution (1991).<br><br><b>ECONOMIC:</b> Western Europe built comprehensive welfare states — NHS in Britain, social insurance across the continent — distinguishing European capitalism from the American model. The postwar economic miracle ("Wirtschaftswunder" in Germany) produced consumer society and mass prosperity. Keynesianism dominated until the 1970s; then Thatcher's neoliberalism (privatization, deregulation) challenged the consensus. Soviet command economies stagnated → contributed to communist collapse.<br><br><b>SOCIAL:</b> 1968: student/worker protests across Europe challenged Cold War conformity and demanded social justice. Feminism (de Beauvoir's <i>Second Sex</i>, 1949), environmentalism, and the sexual revolution transformed social norms. Immigration from former colonies reshaped demographics. Consumer culture and mass media homogenized but also diversified European societies.<br><br><b>GLOBAL (INT):</b> Decolonization (1945–75): European empires dissolved — India (1947), Algeria (violent war, 1954–62), African independence (1960s). Suez Crisis (1956) humiliated Britain and France. Decolonization forced Europeans to reckon with their imperial past and reshaped immigration. Post-colonial relationships evolved into neo-colonial economic dependency.<br><br><b>EUROPEAN INTEGRATION:</b> ECSC (1951) → Treaty of Rome/EEC (1957) → Maastricht Treaty/EU (1993) → Euro (2002) → Expansion eastward (2004). Driven by desire to prevent war, promote prosperity, and create European identity. BUT: Brexit (2016) demonstrated limits of integration. Populism, migration crises, and sovereignty debates challenge the EU project.<br><br><b>CONNECTIONS ←</b> This era resolves (and continues) tensions from every preceding unit. European integration responds to Units 7–8's wars. Decolonization reckons with Unit 1's exploration and Unit 7's imperialism. The welfare state responds to Unit 6's industrialization. Contemporary populism echoes Unit 8's interwar crisis. Understanding today requires understanding all eight preceding eras.`}
];

  {ced:'6.8',era:'industrial',title:'Bismarck\'s Social Insurance',desc:'Bismarck introduced Europe\'s first welfare state: Health Insurance (1883), Accident Insurance (1884), Old Age Pensions (1889). Motivation was conservative — undercut socialist appeal by providing workers security without revolution. Catholic social teaching (Pope Leo XIII, Rerum Novarum, 1891) also advocated for workers\' rights within a capitalist framework.',ap:'Conservative reform to prevent revolution. Compare with British liberal reform and socialist demands.'},

  {ced:'7.5',era:'industrial',title:'Germ Theory and Public Health Revolution',desc:'Louis Pasteur (1860s): proved germs cause disease, developed pasteurization and vaccines (rabies). Robert Koch (1880s): identified specific bacteria causing tuberculosis and cholera. Joseph Lister: antiseptic surgery. These discoveries transformed medicine and public health — urban mortality finally declined. Clean water, sewage systems, and vaccination programs became government responsibilities.',ap:'TSI theme. Connects science to social improvement. Compare with earlier (pre-scientific) approaches to disease.'},
  {ced:'7.5',era:'industrial',title:'Urban Renewal and Technological Optimism',desc:'Baron Haussmann rebuilt Paris (1853-70): wide boulevards (also useful for suppressing barricade revolutions), parks, sewers, modern water supply. Great Exhibition (Crystal Palace, London, 1851): showcased British industrial power and technological optimism. Telegraph (1844) and telephone (1876) transformed communication. Photography changed art and documentation. Electric lighting transformed cities. There was a widespread belief in inevitable progress through science and technology.',ap:'Context for later disillusionment (WWI, Age of Anxiety). Also: Haussmann\'s dual purpose — beauty AND political control.'},

  // 9.5: Postwar Nationalism, Ethnic Conflict, Atrocities — ENTIRELY NEW
  {ced:'9.5',era:'coldwar',title:'Yugoslav Wars and Ethnic Cleansing (1991–2001)',desc:'Breakup of Yugoslavia along ethnic lines: Serbs, Croats, Bosniaks, Kosovar Albanians. Slobodan Milosevic used Serbian nationalism to seize power. Siege of Sarajevo (1992-96). Srebrenica massacre (July 1995): Bosnian Serb forces murdered ~8,000 Bosniak men and boys — worst atrocity in Europe since WWII. NATO intervention (1995 Bosnia, 1999 Kosovo). Dayton Agreement (1995) ended Bosnian war but preserved ethnic divisions.',ap:'Shows ethnic nationalism remains lethal in post-Cold War Europe. Challenges "end of history" thesis. Compare with 1848 or interwar nationalism.'},
  {ced:'9.5',era:'coldwar',title:'Northern Ireland Troubles (1969–1998)',desc:'Sectarian conflict between Catholic/nationalist (IRA) and Protestant/unionist (UVF) communities, with British Army involvement. Bloody Sunday (1972): British soldiers killed 14 unarmed Catholic protesters. ~3,500 killed over 30 years. Good Friday Agreement (1998): power-sharing, decommissioning of weapons. Fragile peace challenged by Brexit (which created border questions).',ap:'Colonial legacy within Europe itself. Compare with other ethnic/religious conflicts. Brexit connection to contemporary challenges.'},
  {ced:'9.5',era:'coldwar',title:'Post-Soviet Ethnic Tensions',desc:'Chechen Wars (1994-2009): Russia fought brutal wars to prevent Chechen independence. Baltic states (Estonia, Latvia, Lithuania): tensions over Russian-speaking minorities after independence. Roma people face persistent discrimination across Europe. Rise of far-right movements targeting minorities in former communist states.',ap:'Nationalism doesn\'t disappear with communism\'s fall — it resurfaces. Continuity from 19th-century ethnic nationalism.'},

  // 9.8: 20th-Century Feminism — ENTIRELY NEW
  {ced:'9.8',era:'coldwar',title:'Second-Wave Feminism (1960s–1980s)',desc:'Inspired by de Beauvoir\'s Second Sex (1949) and American feminists (Friedan). Focused on: workplace equality, reproductive rights (contraceptive pill legalized in most of Europe 1960s-70s), sexual liberation, domestic violence, childcare. In France: MLF (Mouvement de libération des femmes). In Britain: Equal Pay Act 1970, Sex Discrimination Act 1975. Challenged not just legal barriers but cultural norms and language.',ap:'Social change in postwar Europe. Compare first wave (suffrage) with second wave (equality beyond voting).'},
  {ced:'9.8',era:'coldwar',title:'Third-Wave and Contemporary Feminism',desc:'From 1990s: intersectionality (race, class, sexuality, and gender interconnect). Challenged second-wave\'s focus on white middle-class women. #MeToo movement (2017) addressed sexual harassment. Gender pay gap persists. Debates over: quotas for women in politics/business, parental leave policies, reproductive rights (varying by country). Nordic countries as models of gender equality.',ap:'Continuity and change in women\'s status. Shows progress AND persistent inequality.'},

  // 9.11: Migration and Immigration — ENTIRELY NEW
  {ced:'9.11',era:'coldwar',title:'Guest Worker Programs (1950s–1970s)',desc:'Western European labor shortages after WWII led to recruitment of foreign workers. Germany: Gastarbeiter from Turkey, Italy, Greece, Yugoslavia. France: workers from North Africa (Algeria, Morocco, Tunisia). Britain: Windrush generation from Caribbean (1948+), then South Asian immigration. These workers were expected to be temporary but many stayed permanently, transforming European demographics and culture.',ap:'Connects postwar economic boom to contemporary diversity debates. Causes: labor shortage + decolonization.'},
  {ced:'9.11',era:'coldwar',title:'Postcolonial Migration',desc:'Former colonial subjects moved to metropolitan countries: Algerians → France, South Asians/Caribbeans → Britain, Indonesians/Surinamese → Netherlands. They had legal rights as former colonial subjects but faced racism, discrimination, and cultural tension. Created multicultural societies that challenged traditional European national identities.',ap:'INT theme: colonial legacy comes home. Connects imperialism to contemporary Europe.'},
  {ced:'9.11',era:'coldwar',title:'2015 Refugee Crisis and Anti-Immigration Politics',desc:'Syrian civil war + conflicts in Afghanistan, Iraq, and Africa drove over 1 million refugees to Europe in 2015. Divided EU: Germany (Merkel: "Wir schaffen das") accepted ~1M; Hungary/Poland refused. Fueled rise of anti-immigration parties: AfD (Germany), National Front/Rally (France), UKIP/Brexit Party (UK), Fidesz (Hungary). Schengen free-movement area strained. Debates over integration vs. assimilation vs. multiculturalism intensified.',ap:'Contemporary Europe\'s defining challenge. Connects to EU tensions, Brexit, populism, national identity. VERY likely exam topic.'},

  // 9.12: Technology — ENTIRELY NEW
  {ced:'9.12',era:'coldwar',title:'Nuclear Age and Space Race',desc:'Atomic bombs (1945) → nuclear arms race → MAD (Mutually Assured Destruction) doctrine shaped Cold War. Nuclear power for electricity (1950s+) promised cheap energy but Chernobyl disaster (1986) exposed catastrophic risks — accelerated anti-nuclear and environmental movements. Space race: Sputnik (1957), Gagarin (1961), Moon landing (1969) — symbolized superpower competition and technological achievement.',ap:'TSI theme. Technology shapes politics (Cold War) and society (environmental movement).'},
  {ced:'9.12',era:'coldwar',title:'Digital Revolution and Medical Advances',desc:'Computer technology: from room-sized mainframes (1950s) to personal computers (1980s) to internet (1990s) to smartphones (2000s). World Wide Web (1991, Tim Berners-Lee at CERN) transformed communication, commerce, and politics. Social media reshapes democracy and protest. Medical advances: antibiotics (post-penicillin), organ transplants, genetic engineering, IVF. European welfare states made these advances broadly accessible through universal healthcare.',ap:'Connects technology to social change, economics, and politics. Green Revolution (agricultural technology) also increases food production.'},

  // 9.13: Globalization — ENTIRELY NEW
  {ced:'9.13',era:'coldwar',title:'Economic Globalization',desc:'After Cold War: expansion of free trade (WTO, 1995), EU single market, outsourcing of manufacturing to Asia. Benefits: cheaper consumer goods, economic growth, cultural exchange. Costs: deindustrialization in Western Europe, job losses in manufacturing, growing inequality within and between countries. Eurozone crisis (2009-12) exposed vulnerabilities of monetary union without fiscal union.',ap:'ECD theme. Compare with earlier economic integration (Commercial Revolution, 19th-C free trade).'},
  {ced:'9.13',era:'coldwar',title:'Anti-Globalization and Environmental Concerns',desc:'Anti-globalization protests: Seattle WTO protests (1999), Occupy movement (2011). Critics argue globalization benefits corporations at the expense of workers and the environment. Environmental concerns: Chernobyl (1986), ozone depletion, climate change. Kyoto Protocol (1997), Paris Agreement (2015). Green parties gain power across Europe. Greta Thunberg (Swedish, 2018) symbolizes youth climate activism. Tension between economic growth and environmental sustainability.',ap:'Contemporary political challenge. Connects to populism, EU debates, and generational divide.'},

  // 9.14: 21st-Century Culture and Demographics
  {ced:'9.14',era:'coldwar',title:'Demographic Transition and Secularization',desc:'Europe\'s population aging: low birth rates + longer life expectancy → dependency ratio crisis. Pensions and healthcare costs rising. Immigration partially offsets decline but creates cultural tensions. Secularization accelerates: church attendance drops across Western Europe. Religion remains more significant in Eastern Europe and among immigrant communities. Youth culture: from 1960s counterculture through punk to digital native generation.',ap:'SCD theme. Demographic data often appears as MCQ stimulus (charts, graphs).'},

  // 7.2 addition: Civic vs. Ethnic Nationalism
  {ced:'7.2',era:'industrial',title:'Civic vs. Ethnic Nationalism',desc:'Civic nationalism: citizenship based on shared political values and institutions (French model — anyone can become French by adopting French values). Ethnic nationalism: belonging based on shared language, culture, blood, ancestry (German model — Volk, or "people," defines the nation). Pan-movements: Pan-Slavism, Pan-Germanism, Magyarization. Zionism (Theodor Herzl, after Dreyfus Affair) argued Jews needed their own national state. This civic/ethnic distinction explains why some nationalisms were inclusive and others exclusionary.',ap:'KEY distinction for AP exam. Explains why nationalism can be both liberating (Italian/German unification) and destructive (ethnic cleansing, Holocaust).'},

  // 4.6 addition: Enlightened Absolutism specifics
  {ced:'4.6',era:'enlightenment',title:'Enlightened Absolutism: Specific Reforms',desc:'Frederick the Great (Prussia): reformed legal code, promoted religious toleration, abolished torture, improved education — but maintained serfdom and Junker (noble) privileges. Catherine the Great (Russia): corresponded with Voltaire, modernized administration, expanded territory — but Pugachev Rebellion (1773-75) terrified her into abandoning reform; serfdom deepened. Joseph II (Austria): Toleration Patent (1781), abolished serfdom, reformed legal system — but moved too fast; most reforms reversed after his death. KEY POINT: Enlightened absolutism used Enlightenment rhetoric to STRENGTHEN, not limit, state power.',ap:'Comparison opportunity: genuine reform vs. power consolidation. Complexity point: intentions vs. outcomes.'}

/* ── HELPERS ────────────────────────────────────── */

function eraOf(year) {
  if (year < 1450) return 'medieval';
  if (year < 1517) return 'renaissance';
  if (year < 1600) return 'reformation';
  if (year < 1750) return 'absolutism';
  if (year < 1815) return 'enlightenment';
  if (year < 1914) return 'industrial';
  if (year < 1945) return 'worldwars';
  return 'coldwar';
}

function getEventsForEra(eraId) {
  const era = ERAS.find(e => e.id === eraId);
  if (!era) return [];
  return DATA.filter(d => d.startYear >= era.start && d.startYear < era.end && (!currentUnit || d.apUnit === currentUnit))
    .sort((a,b) => a.startYear - b.startYear);
}

function matchSearch(text) {
  if (!searchTerm) return true;
  return text.toLowerCase().includes(searchTerm.toLowerCase());
}

function filterBySearch(items, fields) {
  if (!searchTerm) return items;
  return items.filter(item => fields.some(f => {
    const v = item[f];
    return v && String(v).toLowerCase().includes(searchTerm.toLowerCase());
  }));
}

  const uShort = ['','U1','U2','U3','U4','U5','U6','U7','U8','U9'][d.apUnit] || '';
  return `<div class="ec ${tc}" data-id="${d.id}" tabindex="0" role="button" style="--ec-color:${uc};background:${uc}08;border-color:${uc}30">
    <div class="ct"><span class="cd" style="color:${uc}">${d.date}</span><span class="unit-label" style="background:${uc}">${uShort}</span><span class="cti">${tl}</span></div>
    <div class="cn">${d.title}</div></div>`;
}

function contentCard(item, metaFn) {
  const meta = metaFn ? metaFn(item) : '';
  return `<div class="cc"><div class="cc-title">${item.title || item.name}</div>
    ${meta ? `<div class="cc-meta">${meta}</div>` : ''}
    ${item.desc ? `<div class="cc-desc">${item.desc}</div>` : ''}
    ${item.impact ? `<div class="cc-desc">${item.impact}</div>` : ''}
    ${item.imp ? `<div class="cc-desc">${item.imp}</div>` : ''}
    ${item.note ? `<div class="cc-desc">${item.note}</div>` : ''}</div>`;
}

function miniEntry(item) {
  return `<div class="mini"><span class="m-name">${item.name}</span>
    <span class="m-dates">${item.start||item.years||''}${item.end?'–'+item.end:''}</span>
    <span class="m-note">${item.role?item.role+'. ':''}${item.note||item.idea||''}</span></div>`;
}

/* ── DETAIL PANEL ──────────────────────────────── */

function openDetail(id) {
  const d = DATA.find(e => e.id === id);
  if (!d) return;
  const uc = UC[d.apUnit];
  document.getElementById('dpT').textContent = d.title;
  document.getElementById('dpM').innerHTML = `<span class="dbdg" style="background:${uc}15;color:${uc};border:1px solid ${uc}30">${UN[d.apUnit]}</span>
    <span class="dbdg" style="background:${d.tier===1?'rgba(192,80,32,.1)':'rgba(112,128,144,.1)'};color:${d.tier===1?'var(--tier1)':'var(--tier3)'};border:1px solid ${d.tier===1?'rgba(192,80,32,.2)':'rgba(112,128,144,.2)'}">Tier ${d.tier}</span>
    <span style="font-size:11px;color:var(--tx2);margin-left:5px">${d.date}</span>`;
  let h = `<div class="ds"><h4>Description</h4><p>${d.description||'—'}</p></div>`;
  h += `<div class="ds"><h4>Why It Matters (College Board-Safe)</h4><p style="font-family:var(--font-serif);font-style:italic">${d.whyItMatters||'—'}</p></div>`;
  if (d.causes?.length) h += `<div class="ds"><h4>Causes</h4><ul>${d.causes.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if (d.effects?.length) h += `<div class="ds"><h4>Effects</h4><ul>${d.effects.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if (d.examUse) {
    h += `<div class="ds"><h4>Exam Use</h4><div class="exg">`;
    for (const [k,l] of [['contextualization','Context'],['evidence','Evidence'],['complexity','Complexity'],['comparison','Compare'],['causation','Causation'],['continuityChange','CCOT']]) {
      h += `<div class="exc ${d.examUse[k]?'y':'n'}">${l}</div>`;
    }
    h += `</div></div>`;
  }
  if (d.comparisonOpportunities?.length) h += `<div class="ds"><h4>Comparisons</h4><ul>${d.comparisonOpportunities.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  if (d.continuityChangeOpportunities?.length) h += `<div class="ds"><h4>Continuity & Change</h4><ul>${d.continuityChangeOpportunities.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  const conn = [];
  (d.connectedBefore||[]).forEach(cid => { const cd = DATA.find(x=>x.id===cid); if(cd) conn.push({l:'Before',i:cd}); });
  (d.connectedAfter||[]).forEach(cid => { const cd = DATA.find(x=>x.id===cid); if(cd) conn.push({l:'After',i:cd}); });
  if (conn.length) h += `<div class="ds"><h4>Connected Events</h4><ul>${conn.map(c=>`<li><strong>${c.l}:</strong> <a href="#" onclick="event.preventDefault();openDetail('${c.i.id}')">${c.i.date} — ${c.i.title}</a></li>`).join('')}</ul></div>`;
  if (d.memoryHook) h += `<div class="ds"><h4>Memory Hook</h4><p style="font-style:italic;color:var(--tier2);font-weight:600">${d.memoryHook}</p></div>`;
  h += `<div class="ds"><h4>Tags</h4><div class="dtags">`;
  (d.category||[]).forEach(c => { h += `<span class="dtag">${c}</span>`; });
  (d.region||[]).forEach(r => { h += `<span class="dtag">${r}</span>`; });
  (d.apTheme||[]).forEach(t => { h += `<span class="dtag">${t}</span>`; });
  h += '</div></div>';
  if (d.sourceNote) h += `<div class="ds"><h4>Source</h4><p style="font-size:11px;color:var(--txM)">${d.sourceNote}</p></div>`;
  const bmarks = getBookmarks();
  const isBookmarked = bmarks.includes(d.id);
  h += `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)"><button class="btn" style="width:100%;justify-content:center;${isBookmarked?'background:var(--accL);border-color:var(--acc);color:var(--acc)':''}" onclick="toggleBookmark('${d.id}',this)">${isBookmarked?'★ Bookmarked':'☆ Bookmark for review'}</button></div>`;
  document.getElementById('dpB').innerHTML = h;
  document.getElementById('dp').classList.add('open');
  document.getElementById('dbk').classList.add('open');
}

function toggleBookmark(id, btnEl) {
  let bmarks = getBookmarks();
  const idx = bmarks.indexOf(id);
  if (idx > -1) { bmarks.splice(idx, 1); } else { bmarks.push(id); }
  setBookmarks(bmarks);
  if (btnEl) {
    const isNow = bmarks.includes(id);
    btnEl.innerHTML = isNow ? '★ Bookmarked' : '☆ Bookmark for review';
    btnEl.style.background = isNow ? 'var(--accL)' : '';
    btnEl.style.borderColor = isNow ? 'var(--acc)' : '';
    btnEl.style.color = isNow ? 'var(--acc)' : '';
  }
}

function closeDetail() {
  document.getElementById('dp').classList.remove('open');
  document.getElementById('dbk').classList.remove('open');
}

  h += `<p style="font-size:13px;color:var(--tx2);margin-bottom:10px">${EXAM_SKILLS.saq.desc}</p>`;
  EXAM_SKILLS.saq.items.forEach(i => {
    h += `<div class="cc" style="margin-bottom:8px;border-left:4px solid var(--tier1)"><div class="cc-title"><span style="color:var(--tier1);font-size:18px;font-weight:800;margin-right:6px">${i.letter}</span>${i.name}</div><div class="cc-desc">${i.tip}</div><div class="cc-desc" style="font-style:italic;color:var(--acc);margin-top:4px">Example: ${i.ex}</div></div>`;
  });
  h += '</div>';
  // MCQ Strategies
  h += `<div style="margin-bottom:20px"><h3>${EXAM_SKILLS.mcq.title}</h3>`;
  h += `<p style="font-size:13px;color:var(--tx2);margin-bottom:10px">${EXAM_SKILLS.mcq.desc}</p>`;
  EXAM_SKILLS.mcq.items.forEach(i => {
    h += `<div class="cc" style="margin-bottom:8px"><div class="cc-title">${i.name}</div><div class="cc-desc">${i.tip}</div><div class="cc-desc" style="font-style:italic;color:var(--tier1);margin-top:4px">${i.ex}</div></div>`;
  });
  h += '</div>';
  // Contextualization Starters
  h += `<div style="margin-bottom:20px"><h3>${EXAM_SKILLS.context_starters.title}</h3>`;
  h += `<p style="font-size:13px;color:var(--tx2);margin-bottom:10px">${EXAM_SKILLS.context_starters.desc}</p>`;
  EXAM_SKILLS.context_starters.items.forEach(i => {
    h += `<div class="cc" style="margin-bottom:6px"><div class="cc-title">${i.name}</div><div class="cc-desc" style="font-family:var(--font-serif);font-style:italic">${i.tip}</div></div>`;
  });
  h += '</div>';
  // Bad Evidence Warnings
  h += `<div style="margin-bottom:20px"><h3>${EXAM_SKILLS.bad_evidence.title}</h3>`;
  h += `<p style="font-size:13px;color:var(--tx2);margin-bottom:10px">${EXAM_SKILLS.bad_evidence.desc}</p>`;
  EXAM_SKILLS.bad_evidence.items.forEach(i => {
    h += `<div class="cc" style="margin-bottom:6px;border-left:4px solid var(--tier1)"><div class="cc-title" style="color:var(--tier1)">${i.name}</div><div class="cc-desc">${i.tip}</div></div>`;

  h += '<div id="ep-causation" class="ep-sec"><h2>Causation Chains</h2>';
  h += '<div style="padding:12px 16px;background:var(--accL);border-radius:var(--radius);margin-bottom:16px;font-size:13px;line-height:1.6;border-left:4px solid var(--acc)"><strong style="color:var(--acc)">EXAM TIP:</strong> The AP exam rewards multi-causal explanations. Never give just one cause. Link developments across time: "X led to Y, which in turn caused Z." Use these chains as templates for your essays.</div>';

    h += `<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:700;margin-bottom:8px">${ch.title}</div><div class="chain-flow">`;
    ch.nodes.forEach((n,i) => {
      h += `<div class="chain-node">${n}</div>`;

  });
  h += '</div>';

  // DBQ/LEQ with structure tips
  h += '<div id="ep-dbqleq" class="ep-sec"><h2>DBQ / LEQ Evidence by Period</h2>';

  DBQ_PERIODS.forEach(p => {
    h += `<div class="dbq-period"><h3>${p.title}</h3>`;
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">';

    h += '</div>';
    h += '<div><h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tier1);margin-bottom:8px">Causation Chains</h4>';
    p.cau.forEach(c => { h += `<div class="ev-item">${c}</div>`; });
    h += '<h4 style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--unit4);margin:12px 0 8px">Comparison Opportunities</h4>';
    p.cmp.forEach(c => { h += `<div class="ev-item">${c}</div>`; });
    h += '</div></div>';
    h += '<div class="cx-box"><h4>Complexity Moves — How to Earn the Hardest Point</h4><ul>' + p.cx.map(c=>`<li>${c}</li>`).join('') + '</ul></div>';
    h += '</div>';
  });
  h += '</div>';

  // Evidence Bank
  h += '<div id="ep-evidencebank" class="ep-sec"><h2>Evidence Bank — Ready-to-Deploy for Any Prompt</h2>';
  h += '<p style="font-size:13px;color:var(--tx2);margin-bottom:4px">Click any prompt to reveal pre-built evidence with College Board-safe explanations.</p>';
  h += '<div style="padding:12px 16px;background:var(--accL);border-radius:var(--radius);margin-bottom:16px;font-size:13px;line-height:1.6;border-left:4px solid var(--acc)"><strong style="color:var(--acc)">HOW TO USE:</strong> Each prompt below includes 3-4 pieces of specific evidence with explanations. In your essay, deploy the evidence like this: "[Specific fact] demonstrates [your argument] because [explanation of significance]."</div>';
  const skillLabels = {causation:'Causation Prompts',comparison:'Comparison Prompts',ccot:'Continuity & Change Prompts'};
  const skillIcons = {causation:IC.star,comparison:IC.swords,ccot:IC.chart};
  for (const [skill, label] of Object.entries(skillLabels)) {
    const prompts = EVIDENCE_BANK.filter(e => e.skill === skill);
    h += `<h3 style="font-size:16px;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px"><span style="color:var(--acc)">${skillIcons[skill]}</span>${label} (${prompts.length})</h3>`;
    prompts.forEach(p => {
      h += `<details style="margin-bottom:10px;border:1.5px solid var(--bdr);border-radius:var(--radius);overflow:hidden">`;
      h += `<summary style="padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;background:var(--bgS)">${p.prompt}</summary>`;
      h += '<div style="padding:14px 16px">';
      p.evidence.forEach((e,i) => {
        h += `<div style="margin-bottom:10px;padding:10px 14px;background:var(--bgS);border-radius:8px;border-left:4px solid var(--acc)">
          <div style="font-size:13px;font-weight:600;line-height:1.5">${e.fact}</div>
          <div style="font-size:12px;color:var(--tx2);margin-top:4px;font-style:italic;line-height:1.5">Why this matters: ${e.exp}</div></div>`;
      });
      h += '</div></details>';
    });
  }
  h += '</div>';

  c.innerHTML = h;
}

function renderCram() {

  let h = '<div style="text-align:center;padding:24px 0 28px;border-bottom:2px solid var(--bdr);margin-bottom:24px">';

  h += '</div>';

  // Timing strategy box
  h += '<div class="ep-sec" style="background:var(--accL);border-color:rgba(29,91,160,0.2)">';
  h += '<h2 style="color:var(--acc)">Exam Day Timing Strategy</h2>';
  h += '<div class="g2" style="margin-top:10px">';
  h += '<div class="cc"><div class="cc-title">MCQ: 55 questions in 55 min</div><div class="cc-desc">~1 min per question. Don\'t get stuck — mark it and move on. Eliminate 2 answers first, then choose. Read the question stem BEFORE the stimulus.</div></div>';
  h += '<div class="cc"><div class="cc-title">SAQ: 3 questions in 40 min</div><div class="cc-desc">~13 min each. Claim → Evidence → Explanation for each part. Be direct. No thesis or context needed. Write fast — you need the time.</div></div>';
  h += '<div class="cc"><div class="cc-title">DBQ: 1 question in 60 min</div><div class="cc-desc">15 min reading/planning, 45 min writing. Open with context (2-3 sentences BEFORE your thesis). Use 4+ docs. Add 1 outside evidence. Complexity = connect to another period OR analyze multiple perspectives.</div></div>';
  h += '<div class="cc"><div class="cc-title">LEQ: 1 question in 40 min</div><div class="cc-desc">5 min planning, 35 min writing. Pick the prompt you have the MOST specific evidence for. Thesis must make a defensible claim. Use 2+ specific pieces of evidence with explanations.</div></div>';
  h += '</div></div>';

  // Last-minute reminders
  h += '<div class="ep-sec" style="border-left:4px solid var(--tier1)">';
  h += '<h2>Last-Minute Reminders</h2>';
  h += '<div class="glist" style="margin-top:8px">';
  const reminders = [
    'Causation is king. Always explain WHY something happened, not just WHAT happened.',
    'Wrong time period = wrong answer on MCQ. If an answer mentions something from the wrong century, eliminate it immediately.',
    'The complexity point on DBQ/LEQ: connect to a different time period, explain multiple causes, or analyze diverse perspectives.',
    'Contextualization goes BEFORE your thesis. 2-3 sentences about the broader historical situation.',
    'Use specific evidence: names, dates, treaties, works. "The Enlightenment influenced the Revolution" is weak. "Rousseau\'s concept of popular sovereignty in The Social Contract (1762) provided the ideological framework for the Declaration of the Rights of Man (1789)" is strong.',
    'For comparisons: always state BOTH similarities AND differences.',
    'For CCOT: always explain what CONTINUED alongside what changed.',
    'Read MCQ answers before the stimulus — you\'ll know what to look for.',
    'On the DBQ, you can disagree with or complicate the documents. Don\'t just summarize them.',
    'Sleep matters more than one more hour of studying. Your brain consolidates memory during sleep.'

function buildInlineDetail(d) {
  let h = '<div class="ec-detail">';
  h += `<h5>Description</h5><p>${d.description||'—'}</p>`;
  h += `<h5>Why It Matters</h5><p style="font-family:var(--font-serif);font-style:italic">${d.whyItMatters||'—'}</p>`;
  if (d.causes?.length) h += `<h5>Causes</h5><ul>${d.causes.map(c=>`<li>${c}</li>`).join('')}</ul>`;
  if (d.effects?.length) h += `<h5>Effects</h5><ul>${d.effects.map(c=>`<li>${c}</li>`).join('')}</ul>`;
  if (d.examUse) {
    h += '<h5>Exam Use</h5><div style="display:flex;gap:3px;flex-wrap:wrap">';
    for (const [k,l] of [['contextualization','CTX'],['evidence','EV'],['complexity','CX'],['comparison','CMP'],['causation','CAU'],['continuityChange','CCOT']]) {
      if (d.examUse[k]) h += `<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--accL);color:var(--acc);font-weight:600">${l}</span>`;
    }
    h += '</div>';
  }
  if (d.comparisonOpportunities?.length) h += `<h5>Comparisons</h5><ul>${d.comparisonOpportunities.map(c=>`<li>${c}</li>`).join('')}</ul>`;
  if (d.continuityChangeOpportunities?.length) h += `<h5>Continuity & Change</h5><ul>${d.continuityChangeOpportunities.map(c=>`<li>${c}</li>`).join('')}</ul>`;
  if (d.memoryHook) h += `<h5>Memory Hook</h5><p style="font-weight:600;color:var(--tier2)">${d.memoryHook}</p>`;
  h += '<div class="ec-tags">';
  (d.category||[]).forEach(c => { h += `<span class="ec-tag">${c}</span>`; });
  (d.region||[]).forEach(r => { h += `<span class="ec-tag">${r}</span>`; });
  (d.apTheme||[]).forEach(t => { h += `<span class="ec-tag">${t}</span>`; });
  h += '</div></div>';
  return h;
}

function toggleCard(card, id) {
  if (card.classList.contains('expanded')) {
    card.classList.remove('expanded');
    const det = card.querySelector('.ec-detail');
    if (det) det.remove();
  } else {
    const d = DATA.find(e => e.id === id);
    if (!d) return;
    if (!card.querySelector('.ec-detail')) {
      card.insertAdjacentHTML('beforeend', buildInlineDetail(d));
    }
    card.classList.add('expanded');
  }
}

function bindCards(container) {
  if (!container) return;
  container.querySelectorAll('.ec[data-id]').forEach(card => {
    card.onclick = e => { e.stopPropagation(); toggleCard(card, card.dataset.id); };
    card.onkeydown = e => { if (e.key === 'Enter') toggleCard(card, card.dataset.id); };
  });
  container.querySelectorAll('tr[data-id]').forEach(row => {
    row.onclick = () => openDetail(row.dataset.id);
  });
  container.querySelectorAll('.dtbl').forEach(tbl => {
    tbl.querySelectorAll('th').forEach((th, i) => {
      th.onclick = () => sortTable(tbl, i);
    });
  });
}

/* ── TABLE SORTING ─────────────────────────────── */
let sortState = {};
function sortTable(tableEl, colIdx) {
  const tbody = tableEl.querySelector('tbody');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  const key = tableEl.id || colIdx;
  const prev = sortState[key];
  const asc = (prev && prev.col === colIdx && prev.asc) ? false : true;
  sortState[key] = {col: colIdx, asc};
  rows.sort((a, b) => {
    const aText = (a.cells[colIdx]?.textContent || '').trim();
    const bText = (b.cells[colIdx]?.textContent || '').trim();
    const aNum = parseFloat(aText.replace(/[^0-9.\-]/g, ''));
    const bNum = parseFloat(bText.replace(/[^0-9.\-]/g, ''));
    if (!isNaN(aNum) && !isNaN(bNum)) return asc ? aNum - bNum : bNum - aNum;
    return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
  });
  rows.forEach(r => tbody.appendChild(r));
  tableEl.querySelectorAll('th').forEach((th, i) => {
    th.textContent = th.textContent.replace(/ [▲▼]$/, '');
    if (i === colIdx) th.textContent += asc ? ' ▲' : ' ▼';
  });
}

/* ── SEARCH ────────────────────────────────────── */

function handleSearch() {
  const prev = searchTerm;
  searchTerm = document.getElementById('si').value;
  if (searchTerm !== prev) {
    const renderers = {study:renderStudy,tables:renderTables};
    if (renderers[currentView]) renderers[currentView]();
    if (currentView === 'study') collapseBySearch();
  }
}

function collapseBySearch() {
  const secs = document.querySelectorAll('.era-sec');
  secs.forEach(sec => {
    const hdr = sec.querySelector('.era-hdr');
    const body = sec.querySelector('.era-body');
    if (!hdr || !body) return;
    if (searchTerm) {
      const cards = body.querySelectorAll('.ec, .cc, .mini');
      if (cards.length === 0) {
        hdr.classList.add('collapsed');
        body.classList.add('collapsed');
      } else {
        hdr.classList.remove('collapsed');
        body.classList.remove('collapsed');
      }
    } else {
      hdr.classList.remove('collapsed');
      body.classList.remove('collapsed');
    }
  });
}
