        <!-- CRITICAL: Aggressive fallback to remove stuck loader/overlays -->
        <script>
            (function() {
                function forceRemoveLoader() {
                    let didCleanup = false;
                    // Force hide loader if it's still visible
                    const loader = document.getElementById('nn-intel-loader');
                    if (loader) {
                        const computed = window.getComputedStyle(loader);
                        const isVisible = computed.display !== 'none' && computed.visibility !== 'hidden' && computed.opacity !== '0';
                        if (isVisible) {
                            console.warn('[SituationMonitor] Force-removing stuck loader');
                            loader.style.display = 'none';
                            loader.style.visibility = 'hidden';
                            loader.style.opacity = '0';
                            loader.style.zIndex = '-999999';
                            loader.style.pointerEvents = 'none';
                            loader.style.position = 'fixed';
                            loader.style.top = '-9999px';
                            loader.style.left = '-9999px';
                            loader.style.width = '0';
                            loader.style.height = '0';
                            didCleanup = true;
                            // Try to call hideLoader if available
                            if (window.hideLoader && typeof window.hideLoader === 'function') {
                                try {
                                    window.hideLoader();
                                } catch (e) {
                                    // Ignore
                                }
                            }
                            if (loader.parentNode) {
                                try {
                                    loader.parentNode.removeChild(loader);
                                } catch (e) {
                                    console.warn('[SituationMonitor] Could not remove loader:', e);
                                }
                            }
                        } else {
                            didCleanup = true;
                        }
                    } else {
                        didCleanup = true;
                    }
                    
                    // Remove loading placeholder if still visible
                    const placeholder = document.getElementById('sitmon-loading-placeholder');
                    if (placeholder) {
                        placeholder.style.display = 'none';
                        placeholder.style.visibility = 'hidden';
                        placeholder.style.opacity = '0';
                        didCleanup = true;
                    }
                    
                    // Remove ANY div that's blocking the screen (aggressive cleanup)
                    const allDivs = document.querySelectorAll('body > div');
                    allDivs.forEach((div, index) => {
                        const rect = div.getBoundingClientRect();
                        const isFullScreen = rect.width >= window.innerWidth * 0.9 && rect.height >= window.innerHeight * 0.9;
                        const hasHighZIndex = window.getComputedStyle(div).zIndex > 1000 || div.style.zIndex > 1000;
                        const isFixed = window.getComputedStyle(div).position === 'fixed';
                        
                        // If it's a full-screen fixed overlay with high z-index, remove it
                        if (isFullScreen && isFixed && hasHighZIndex && div.id !== 'situation-monitor-container') {
                            console.warn('[SituationMonitor] Removing blocking div[', index, ']:', div.id || div.className || 'unnamed');
                            div.style.display = 'none';
                            div.style.visibility = 'hidden';
                            div.style.opacity = '0';
                            div.style.pointerEvents = 'none';
                            div.style.zIndex = '-999999';
                            didCleanup = true;
                        }
                    });
                    
                    // Remove any other blocking overlays with high z-index
                    const blockingElements = document.querySelectorAll('[style*="z-index: 99999"], [style*="z-index: 999999"], [class*="overlay"][style*="position: fixed"], [class*="nn-il"]');
                    blockingElements.forEach(el => {
                        const rect = el.getBoundingClientRect();
                        if (rect.width >= window.innerWidth * 0.9 && rect.height >= window.innerHeight * 0.9) {
                            console.warn('[SituationMonitor] Removing blocking overlay:', el.id || el.className);
                            el.style.display = 'none';
                            el.style.pointerEvents = 'none';
                            el.style.zIndex = '-999999';
                            didCleanup = true;
                        }
                    });
                    
                    // Force show container
                    const container = document.getElementById('situation-monitor-container');
                    if (container) {
                        container.style.display = 'block';
                        container.style.visibility = 'visible';
                        container.style.opacity = '1';
                        container.style.zIndex = '1';
                    }
                    
                    // Restore body
                    document.body.style.overflow = '';
                    document.body.style.pointerEvents = 'auto';
                    
                    return didCleanup;
                }
                
                // Try immediately (in case loader is already stuck)
                setTimeout(forceRemoveLoader, 50);
                
                // Also try after 1 second, 5 seconds, 10 seconds
                setTimeout(forceRemoveLoader, 1000);
                setTimeout(forceRemoveLoader, 5000);
                setTimeout(forceRemoveLoader, 10000);
                
                // Continuous monitoring every 2 seconds to catch any stuck loaders
                let loaderIntervalId = null;
                loaderIntervalId = setInterval(() => {
                    const didCleanup = forceRemoveLoader();
                    if (didCleanup && loaderIntervalId) {
                        clearInterval(loaderIntervalId);
                        loaderIntervalId = null;
                        console.log('[SituationMonitor] Loader removed - stopping monitor');
                    }
                }, 2000);
                
                console.log('[SituationMonitor] Aggressive loader removal active - monitoring every 2s');
                
                // Also try after 3 seconds
                setTimeout(forceRemoveLoader, 3000);
                
                // Final fallback after 10 seconds
                setTimeout(function() {
                    forceRemoveLoader();
                    console.log('[SituationMonitor] Fallback: Forced container visibility after 10s');
                }, 10000);
            })();
        </script>

    <!-- Music Control Button (for header, controls Situation Monitor music) -->
    <script>
        // Initialize music control button to work with Situation Monitor music
        (function() {
            const musicBtn = document.getElementById('musicControlBtn');
            if (!musicBtn) return;

            // Get the Situation Monitor audio elements
            const audio = document.getElementById('situationMonitorMusic');
            const audioSecond = document.getElementById('situationMonitorMusicSecond');
            const audioThird = document.getElementById('situationMonitorMusicThird');

            function getCurrentAudio() {
                if (audio && !audio.paused && !audio.ended) return audio;
                if (audioSecond && !audioSecond.paused && !audioSecond.ended) return audioSecond;
                if (audioThird && !audioThird.paused && !audioThird.ended) return audioThird;
                return audio || audioSecond || audioThird;
            }

            function updateMusicButton() {
                const current = getCurrentAudio();
                const isPlaying = current && !current.paused && !current.ended;

                if (isPlaying) {
                    musicBtn.classList.add('playing');
                    musicBtn.innerHTML = '<span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 1em; height: 1em; color: currentColor;"><path d="M4 8v8h4l5 5V3L8 8H4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.08" opacity="0.6"/><path d="M15 10c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.25"/><path d="M17 6c3.3 0 6 2.7 6 6s-2.7 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.25"/><path d="M17 3c5 0 9 4 9 9s-4 9-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.2"/><path d="M2 2l20 20" stroke="#ff4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M3 3l18 18" stroke="#ff6666" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/></svg></span>';
                    musicBtn.title = 'Pause Background Music';
                } else {
                    musicBtn.classList.remove('playing');
                    musicBtn.innerHTML = '<span class="btn-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 1em; height: 1em; color: currentColor;"><path d="M9 18V5l9-2v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="currentColor" fill-opacity="0.1"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.2"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.2"/></svg></span>';
                    musicBtn.title = 'Play Background Music';
                }
            }

            musicBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                const current = getCurrentAudio();
                if (!current) return;

                if (current.paused || current.ended) {
                    // Play the current track
                    current.play().catch(err => {
                        console.error('Failed to play music:', err);
                    });
                } else {
                    // Pause all tracks
                    if (audio) audio.pause();
                    if (audioSecond) audioSecond.pause();
                    if (audioThird) audioThird.pause();
                }
                updateMusicButton();
            });

            // Update button state when music state changes
            [audio, audioSecond, audioThird].forEach(a => {
                if (a) {
                    a.addEventListener('play', updateMusicButton);
                    a.addEventListener('pause', updateMusicButton);
                    a.addEventListener('ended', updateMusicButton);
                }
            });

            // Initial state
            updateMusicButton();
        })();
    </script>

    <!-- Fix for any stuck overlays or modals -->
    <script>
        // Remove any stuck overlays or modals that might be blocking the page
        (function() {
            // Wait a bit for page to load
            setTimeout(() => {
                // Check for common overlay patterns that might be stuck
                const stuckOverlays = document.querySelectorAll('[style*="position: fixed"][style*="z-index"][style*="999"]');
                stuckOverlays.forEach(overlay => {
                    // Only remove if it's covering the entire screen and has no content
                    const rect = overlay.getBoundingClientRect();
                    const isFullScreen = rect.width >= window.innerWidth * 0.9 && rect.height >= window.innerHeight * 0.9;
                    const hasContent = overlay.textContent.trim().length > 0 || overlay.querySelector('*');
                    
                    // If it's a full-screen overlay with minimal content, it might be stuck
                    if (isFullScreen && !hasContent && overlay.id !== 'sitmon-loading-placeholder') {
                        console.warn('[SituationMonitor] Removing potentially stuck overlay:', overlay);
                        overlay.style.display = 'none';
                    }
                });
                
                // Also check for elements with very high z-index that might be blocking
                const highZIndex = document.querySelectorAll('[style*="z-index: 99999"], [style*="z-index: 999999"]');
                highZIndex.forEach(el => {
                    // If it's not visible or has no meaningful content, hide it
                    if (el.offsetParent === null || (!el.textContent.trim() && !el.querySelector('*'))) {
                        console.warn('[SituationMonitor] Hiding potentially blocking element:', el);
                        el.style.display = 'none';
                    }
                });
            }, 2000);
        })();
    </script>

    <!-- Mobile Menu Script -->
    <script>
        // Initialize mobile menu
        (function() {
            const mobileMenuToggle = document.getElementById('mobileMenuToggle');
            const mobileNav = document.getElementById('mobileNav');
            
            if (!mobileMenuToggle || !mobileNav) return;
            
            // Toggle mobile menu
            mobileMenuToggle.addEventListener('click', () => {
                mobileNav.classList.toggle('active');
                mobileMenuToggle.classList.toggle('active');
                mobileMenuToggle.setAttribute('aria-expanded', mobileNav.classList.contains('active'));
            });
            
            // Close menu when clicking a link
            const mobileNavLinks = mobileNav.querySelectorAll('.nav-link');
            mobileNavLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileNav.classList.remove('active');
                    mobileMenuToggle.classList.remove('active');
                    mobileMenuToggle.setAttribute('aria-expanded', 'false');
                });
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!mobileMenuToggle.contains(e.target) && !mobileNav.contains(e.target)) {
                    mobileNav.classList.remove('active');
                    mobileMenuToggle.classList.remove('active');
                    mobileMenuToggle.setAttribute('aria-expanded', 'false');
                }
            });
            
            // Close menu on Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                    mobileNav.classList.remove('active');
                    mobileMenuToggle.classList.remove('active');
                    mobileMenuToggle.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>

    <!-- Security Check Verification -->
    <script>
        (function() {
            // Check if user has passed security check (same system as game.html)
            const SECURITY_CHECK_KEY = 'security-check-verified';
            const SECURITY_CHECK_TIMESTAMP = 'security-check-timestamp';
            const SECURITY_CHECK_TTL = 30 * 60 * 1000; // 30 minutes
            
            // Check if already verified
            const verified = sessionStorage.getItem(SECURITY_CHECK_KEY) === 'true';
            const timestamp = parseInt(sessionStorage.getItem(SECURITY_CHECK_TIMESTAMP) || '0', 10);
            const now = Date.now();
            const isExpired = timestamp > 0 && (now - timestamp) > SECURITY_CHECK_TTL;
            
            // If expired, clear the verification
            if (isExpired) {
                sessionStorage.removeItem(SECURITY_CHECK_KEY);
                sessionStorage.removeItem(SECURITY_CHECK_TIMESTAMP);
            }
            
            if (verified && !isExpired) {
                // Already verified and not expired, proceed
                console.log('[SituationMonitor] Security check passed, initializing...');
                initSituationMonitor();
            } else {
                // Not verified or expired, redirect to security check
                const currentUrl = window.location.href;
                const securityCheckUrl = `security-check.html?return=${encodeURIComponent(currentUrl)}`;
                console.log('[SituationMonitor] Redirecting to security check:', securityCheckUrl);
                window.location.href = securityCheckUrl;
            }
        })();
        
        // Situation Monitor initialization function
        function initSituationMonitor() {
            // Wait for D3 and TopoJSON to load, then initialize
            let retryCount = 0;
            const maxRetries = 50; // 5 seconds max wait
            
            function init() {
            if (typeof window.d3 === 'undefined' || typeof window.topojson === 'undefined') {
                    retryCount++;
                    if (retryCount > maxRetries) {
                        console.error('[SituationMonitor] D3/TopoJSON failed to load after', maxRetries * 100, 'ms');
                        const placeholder = document.getElementById('sitmon-loading-placeholder');
                        if (placeholder) {
                            placeholder.innerHTML = '<div style="text-align: center; color: #ff6b6b;"><p>Failed to load required libraries. Please refresh the page.</p></div>';
                        }
                        return;
                    }
                    console.warn('[SituationMonitor] Waiting for D3/TopoJSON to load... (attempt', retryCount, ')');
                    setTimeout(init, 100);
                    return;
                }
                
                console.log('[SituationMonitor] D3/TopoJSON loaded, importing Situation Monitor...');

                // Show a simple loading indicator immediately (before modules load)
                const placeholder = document.getElementById('sitmon-loading-placeholder');
                if (placeholder) {
                    placeholder.innerHTML = `
                        <div style="text-align: center;">
                            <div style="width: 60px; height: 60px; border: 4px solid rgba(34, 211, 238, 0.2); border-top: 4px solid #22d3ee; border-radius: 50%; margin: 0 auto 1rem; animation: spin 1s linear infinite;"></div>
                            <p style="color: rgba(255, 255, 255, 0.9); font-size: 1.1rem; margin: 0;">Loading Situation Monitor...</p>
                        </div>
                        <style>
                            @keyframes spin {
                                0% { transform: rotate(0deg); }
                                100% { transform: rotate(360deg); }
                            }
                        </style>
                    `;
                }
                
                // Import Intel Loader first and initialize it (idempotent)
                // SituationMonitorShell.init() will call showLoader() - no race condition
                import('./src/loader/IntelLoader.js').then((loaderModule) => {
                    console.log('[SituationMonitor] Intel Loader loaded');
                    // Initialize loader (creates DOM structure, but doesn't show yet)
                    if (loaderModule && loaderModule.initIntelLoader) {
                        loaderModule.initIntelLoader();
                    }
                    // Hide the placeholder - loader will show when SituationMonitorShell calls showLoader()
                    if (placeholder) {
                        placeholder.style.display = 'none';
                    }
                    // Import and initialize Situation Monitor (which will call showLoader)
                    return import('./src/components/situation-monitor/SituationMonitorShell.js');
                }).then(module => {
                    console.log('[SituationMonitor] Module loaded, creating shell...');

                    // Remove loading placeholder
                    const placeholder = document.getElementById('sitmon-loading-placeholder');
                    if (placeholder) {
                        placeholder.style.display = 'none';
                    }
                    
                    // Ensure container exists
                    const container = document.getElementById('situation-monitor-container');
                    if (!container) {
                        console.error('[SituationMonitor] Container not found!');
                        if (placeholder) {
                            placeholder.innerHTML = '<div style="text-align: center; color: #ff6b6b;"><p>Container not found. Please refresh the page.</p></div>';
                            placeholder.style.display = 'flex';
                        }
                return;
                    }
                    
                    try {
                        // DOMContentLoaded may have already fired, so check readyState
                        if (document.readyState === 'loading') {
                            document.addEventListener('DOMContentLoaded', () => {
                                console.log('[SituationMonitor] DOMContentLoaded fired, creating shell...');
                                const shell = new module.SituationMonitorShell('situation-monitor-container');
                                window.situationMonitor = shell;
                            });
                        } else {
                            // DOM already loaded
                            console.log('[SituationMonitor] DOM already loaded, creating shell...');
                            const shell = new module.SituationMonitorShell('situation-monitor-container');
                            window.situationMonitor = shell;
                        }
                    } catch (err) {
                        console.error('[SituationMonitor] Error creating shell:', err);
                        if (placeholder) {
                            placeholder.innerHTML = '<div style="text-align: center; color: #ff6b6b;"><p>Error initializing Situation Monitor. Please refresh the page.</p><p style="font-size: 0.8rem; margin-top: 0.5rem;">' + err.message + '</p></div>';
                            placeholder.style.display = 'flex';
                        }
                    }
                }).catch(err => {
                    console.error('[SituationMonitor] Failed to load module:', err);
                    // Remove loading placeholder even on error
                    const placeholder = document.getElementById('sitmon-loading-placeholder');
                    if (placeholder) {
                        placeholder.innerHTML = '<div style="text-align: center; color: #ff6b6b;"><p>Failed to load Situation Monitor. Please refresh the page.</p><p style="font-size: 0.8rem; margin-top: 0.5rem;">' + (err.message || 'Unknown error') + '</p></div>';
                        placeholder.style.display = 'flex';
                    }
                });
            }
            
            // Start initialization
            init();
        }
    </script>

    <!-- Audio Control Script -->
    <script>
        // Play Arabian.wav automatically when page loads, then datacenter.wav, then CoolIntelsong.wav
        (function() {
            const audio = document.getElementById('situationMonitorMusic');
            const audioSecond = document.getElementById('situationMonitorMusicSecond');
            const audioThird = document.getElementById('situationMonitorMusicThird');
            if (!audio || !audioSecond || !audioThird) return;

            // Set volume (adjust as needed, 0.0 to 1.0)
            audio.volume = 0.5;
            audioSecond.volume = 0.5;
            audioThird.volume = 0.5;

            // Track which audio is currently active
            let currentAudio = audio;

            // Helper function to play next track with error handling
            function playNextTrack(currentTrack, nextTrack, trackName) {
                return new Promise((resolve) => {
                    // Check if next track can load
                    const checkLoad = () => {
                        if (nextTrack.readyState >= 2) { // HAVE_CURRENT_DATA or higher
                            currentAudio = nextTrack;
                            nextTrack.currentTime = 0;
                            nextTrack.play()
                                .then(() => {
                                    console.log(`🎵 ${trackName} started playing`);
                                    resolve(true);
                                })
                                .catch(err => {
                                    console.warn(`Failed to play ${trackName}, skipping to next:`, err);
                                    // Try to skip to next track in chain
                                    if (nextTrack === audioSecond) {
                                        // datacenter.wav failed, skip to CoolIntelsong.wav
                                        playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav').then(resolve);
                                    } else {
                                        // CoolIntelsong.wav failed or we're at the end
                                        resolve(false);
                                    }
                                });
                        } else {
                            // Wait for track to load, but timeout after 3 seconds
                            const timeout = setTimeout(() => {
                                console.warn(`${trackName} failed to load, skipping to next`);
                                if (nextTrack === audioSecond) {
                                    playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav').then(resolve);
                                } else {
                                    resolve(false);
                                }
                            }, 3000);
                            
                            nextTrack.addEventListener('canplay', () => {
                                clearTimeout(timeout);
                                checkLoad();
                            }, { once: true });
                            
                            nextTrack.addEventListener('error', () => {
                                clearTimeout(timeout);
                                console.warn(`${trackName} has load error, skipping to next`);
                                if (nextTrack === audioSecond) {
                                    playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav').then(resolve);
                                } else {
                                    resolve(false);
                                }
                            }, { once: true });
                            
                            // Trigger load if not already loading
                            if (nextTrack.readyState === 0) {
                                nextTrack.load();
                            }
                        }
                    };
                    
                    checkLoad();
                });
            }

            // When Arabian.wav ends, start datacenter.wav
            audio.addEventListener('ended', () => {
                console.log('🎵 Arabian.wav finished, starting datacenter.wav');
                playNextTrack(audio, audioSecond, 'datacenter.wav');
            });

            // When datacenter.wav ends, start CoolIntelsong.wav
            audioSecond.addEventListener('ended', () => {
                console.log('🎵 datacenter.wav finished, starting CoolIntelsong.wav');
                playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav');
            });

            // Try to play when page loads
            function playMusic() {
                currentAudio = audio;
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('🎵 Arabian.wav started playing');
                        })
                        .catch(error => {
                            console.warn('🎵 Audio autoplay prevented:', error);
                            // Autoplay was prevented - user interaction required
                            // Add a button to let user start music manually
                            addMusicButton();
                        });
                }
            }

            // Add a button to start music if autoplay fails
            function addMusicButton() {
                const button = document.createElement('button');
                button.innerHTML = '🎵 Play Background Music';
                button.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    padding: 12px 24px;
                    background: rgba(34, 211, 238, 0.2);
                    border: 2px solid rgba(34, 211, 238, 0.4);
                    border-radius: 12px;
                    color: #22d3ee;
                    font-weight: 600;
                    cursor: pointer;
                    z-index: 1000;
                    font-size: 0.9rem;
                    transition: all 0.3s ease;
                `;
                button.onmouseover = () => {
                    button.style.background = 'rgba(34, 211, 238, 0.3)';
                    button.style.borderColor = 'rgba(34, 211, 238, 0.6)';
                };
                button.onmouseout = () => {
                    button.style.background = 'rgba(34, 211, 238, 0.2)';
                    button.style.borderColor = 'rgba(34, 211, 238, 0.4)';
                };
                button.onclick = () => {
                    currentAudio = audio;
                    audio.currentTime = 0;
                    audio.play().then(() => {
                        button.innerHTML = '⏸️ Pause Music';
                        button.onclick = () => {
                            const isPlaying = !audio.paused || !audioSecond.paused || !audioThird.paused;
                            if (isPlaying) {
                                audio.pause();
                                audioSecond.pause();
                                audioThird.pause();
                                button.innerHTML = '▶️ Play Music';
                            } else {
                                const current = getCurrentAudio();
                                if (current === audio) {
                                    audio.play();
                                } else if (current === audioSecond) {
                                    audioSecond.play();
                                } else {
                                    audioThird.play();
                                }
                                button.innerHTML = '⏸️ Pause Music';
                            }
                        };
                    }).catch(err => {
                        console.error('Failed to play audio:', err);
                    });
                };
                document.body.appendChild(button);
            }

            // Wait for page to be interactive, then try to play
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(playMusic, 500); // Small delay to ensure everything is loaded
                });
            } else {
                setTimeout(playMusic, 500);
            }

            // Music Controls
            const musicBtn = document.getElementById('sitmonMusicBtn');
            const skipBtn = document.getElementById('sitmonSkipBtn');
            const volumeSlider = document.getElementById('sitmonVolumeSlider');
            const volumeBtn = document.getElementById('sitmonVolumeBtn');
            const playIcon = musicBtn?.querySelector('.play-icon');
            const pauseIcon = musicBtn?.querySelector('.pause-icon');
            const volumeHighIcon = volumeBtn?.querySelector('.volume-high-icon');
            const volumeMuteIcon = volumeBtn?.querySelector('.volume-mute-icon');

            // Load saved volume from localStorage
            const savedVolume = localStorage.getItem('sitmonMusicVolume');
            if (savedVolume !== null) {
                const volume = parseFloat(savedVolume);
                audio.volume = volume;
                audioSecond.volume = volume;
                audioThird.volume = volume;
                if (volumeSlider) volumeSlider.value = (volume * 100).toString();
            }

            // Helper function to get the currently playing audio
            function getCurrentAudio() {
                if (!audio.paused) return audio;
                if (!audioSecond.paused) return audioSecond;
                if (!audioThird.paused) return audioThird;
                // If all are paused, return the one that should be playing
                return currentAudio;
            }

            // Sync volume between all audio elements
            function syncVolume() {
                const vol = getCurrentAudio().volume;
                audio.volume = vol;
                audioSecond.volume = vol;
                audioThird.volume = vol;
            }

            // Update play/pause button
            function updatePlayPauseButton() {
                if (!musicBtn || !playIcon || !pauseIcon) return;
                
                const isPlaying = !audio.paused || !audioSecond.paused || !audioThird.paused;
                if (isPlaying) {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    musicBtn.title = 'Pause Background Music';
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    musicBtn.title = 'Play Background Music';
                }
            }

            // Update volume icon
            function updateVolumeIcon() {
                if (!volumeBtn || !volumeHighIcon || !volumeMuteIcon) return;
                
                const current = getCurrentAudio();
                if (current.volume === 0 || current.muted) {
                    volumeHighIcon.style.display = 'none';
                    volumeMuteIcon.style.display = 'block';
                    volumeBtn.title = 'Unmute';
                } else {
                    volumeHighIcon.style.display = 'block';
                    volumeMuteIcon.style.display = 'none';
                    volumeBtn.title = 'Mute';
                }
            }

            // Play/Pause button
            if (musicBtn) {
                musicBtn.addEventListener('click', () => {
                    const isPlaying = !audio.paused || !audioSecond.paused || !audioThird.paused;
                    if (isPlaying) {
                        // Pause all
                        audio.pause();
                        audioSecond.pause();
                        audioThird.pause();
                        updatePlayPauseButton();
                    } else {
                        // Resume from where we left off, or start from beginning
                        const current = getCurrentAudio();
                        if (current === audio && audio.currentTime > 0 && audio.currentTime < audio.duration) {
                            // Resume Arabian.wav
                            audio.play().then(() => {
                                updatePlayPauseButton();
                            }).catch(err => {
                                console.error('Failed to play audio:', err);
                            });
                        } else if (current === audioSecond && audioSecond.currentTime > 0 && audioSecond.currentTime < audioSecond.duration) {
                            // Resume datacenter.wav
                            audioSecond.play().then(() => {
                                updatePlayPauseButton();
                            }).catch(err => {
                                console.error('Failed to play audio:', err);
                            });
                        } else if (current === audioThird && audioThird.currentTime > 0) {
                            // Resume CoolIntelsong.wav
                            audioThird.play().then(() => {
                                updatePlayPauseButton();
                            }).catch(err => {
                                console.error('Failed to play audio:', err);
                            });
                        } else {
                            // Start from beginning (Arabian.wav)
                            currentAudio = audio;
                            audio.currentTime = 0;
                            audio.play().then(() => {
                                updatePlayPauseButton();
                            }).catch(err => {
                                console.error('Failed to play audio:', err);
                            });
                        }
                    }
                });

                audio.addEventListener('play', updatePlayPauseButton);
                audio.addEventListener('pause', updatePlayPauseButton);
                audioSecond.addEventListener('play', updatePlayPauseButton);
                audioSecond.addEventListener('pause', updatePlayPauseButton);
                audioThird.addEventListener('play', updatePlayPauseButton);
                audioThird.addEventListener('pause', updatePlayPauseButton);
                updatePlayPauseButton();
            }

            // Skip to next song
            function skipToNext() {
                const current = getCurrentAudio();
                const wasPlaying = !current.paused;
                
                // Stop all tracks
                audio.pause();
                audioSecond.pause();
                audioThird.pause();
                
                // Determine next track
                if (current === audio) {
                    // Currently on Arabian.wav, skip to datacenter.wav
                    console.log('🎵 Skipping to datacenter.wav');
                    if (wasPlaying) {
                        playNextTrack(audio, audioSecond, 'datacenter.wav').then(success => {
                            if (!success) {
                                // datacenter.wav failed, try CoolIntelsong.wav
                                console.log('🎵 datacenter.wav unavailable, skipping to CoolIntelsong.wav');
                                playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav');
                            }
                            updatePlayPauseButton();
                        });
                    } else {
                        currentAudio = audioSecond;
                        updatePlayPauseButton();
                    }
                } else if (current === audioSecond) {
                    // Currently on datacenter.wav, skip to CoolIntelsong.wav
                    console.log('🎵 Skipping to CoolIntelsong.wav');
                    if (wasPlaying) {
                        playNextTrack(audioSecond, audioThird, 'CoolIntelsong.wav').then(() => {
                            updatePlayPauseButton();
                        });
                    } else {
                        currentAudio = audioThird;
                        updatePlayPauseButton();
                    }
                } else {
                    // Currently on CoolIntelsong.wav, loop back to Arabian.wav
                    console.log('🎵 Skipping to Arabian.wav (start of queue)');
                    currentAudio = audio;
                    audio.currentTime = 0;
                    if (wasPlaying) {
                        audio.play().catch(err => {
                            console.error('Failed to play Arabian.wav:', err);
                        });
                    }
                    updatePlayPauseButton();
                }
            }

            // Skip button
            if (skipBtn) {
                skipBtn.addEventListener('click', skipToNext);
            }

            // Volume slider
            if (volumeSlider) {
                volumeSlider.addEventListener('input', (e) => {
                    const volume = e.target.value / 100;
                    audio.volume = volume;
                    audioSecond.volume = volume;
                    audioThird.volume = volume;
                    audio.muted = false;
                    audioSecond.muted = false;
                    audioThird.muted = false;
                    localStorage.setItem('sitmonMusicVolume', volume.toString());
                    updateVolumeIcon();
                });

                // Update slider when volume changes externally
                function handleVolumeChange() {
                    const current = getCurrentAudio();
                    if (!current.muted) {
                        volumeSlider.value = (current.volume * 100).toString();
                    }
                    syncVolume();
                    updateVolumeIcon();
                }
                audio.addEventListener('volumechange', handleVolumeChange);
                audioSecond.addEventListener('volumechange', handleVolumeChange);
                audioThird.addEventListener('volumechange', handleVolumeChange);
            }

            // Mute/Unmute button
            if (volumeBtn) {
                volumeBtn.addEventListener('click', () => {
                    const current = getCurrentAudio();
                    if (current.muted || current.volume === 0) {
                        audio.muted = false;
                        audioSecond.muted = false;
                        audioThird.muted = false;
                        if (current.volume === 0) {
                            const vol = 0.5;
                            audio.volume = vol;
                            audioSecond.volume = vol;
                            audioThird.volume = vol;
                            if (volumeSlider) volumeSlider.value = '50';
                            localStorage.setItem('sitmonMusicVolume', '0.5');
                        }
                    } else {
                        audio.muted = true;
                        audioSecond.muted = true;
                        audioThird.muted = true;
                    }
                    updateVolumeIcon();
                });
            }

            // Initial volume icon state
            updateVolumeIcon();
        })();
    </script>
