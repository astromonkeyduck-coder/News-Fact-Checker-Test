<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe Survey - Noteworthy News</title>
    <!-- Favicon and Theme -->
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="32x32">
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="192x192">
    <link rel="shortcut icon" type="image/png" href="IMG_5794.PNG">
    <link rel="apple-touch-icon" href="IMG_5794.PNG" sizes="180x180">
    <link rel="mask-icon" href="IMG_5794.PNG" color="#0f234a">
    <meta name="theme-color" content="#0f234a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d2d5a 100%) !important;
            min-height: 100vh;
            overflow-x: hidden;
            overscroll-behavior: none !important;
            overscroll-behavior-x: none !important;
            overscroll-behavior-y: none !important;
            -webkit-overflow-scrolling: touch;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d2d5a 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .survey-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #4A90E2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .question {
            margin-bottom: 30px;
        }
        
        .question-label {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
            display: block;
        }
        
        .option {
            display: block;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .option:hover {
            background: rgba(74, 144, 226, 0.2);
            border-color: #4A90E2;
            transform: translateX(5px);
        }
        
        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }
        
        .option input[type="radio"]:checked + label,
        .option:has(input[type="radio"]:checked) {
            background: rgba(74, 144, 226, 0.3);
            border-color: #4A90E2;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }
        
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4A90E2 0%, #2A60B0 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-message {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1rem;
            line-height: 1.6;
            text-align: center;
            display: none;
        }
        
        .status-message.show {
            display: block;
        }
        
        .status-message.success {
            background: rgba(46, 204, 113, 0.2);
            border: 2px solid rgba(46, 204, 113, 0.5);
            color: #2ecc71;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .survey-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <div class="logo">
            <a href="index.html" aria-label="Go to Noteworthy News homepage">
                <img src="IMG_5992.PNG" alt="Noteworthy News Logo" loading="lazy">
            </a>
        </div>
        <h1>Why Are You Leaving? 😢</h1>
        <p class="subtitle">Help us improve with this quick 30-second survey!</p>
        
        <form id="surveyForm">
            <div class="question">
                <label class="question-label">Why did you unsubscribe? 🎯</label>
                <label class="option">
                    <input type="radio" name="reason" value="too-many-emails" required>
                    <span>Too many emails (I'm drowning in newsletters!) 📧</span>
                </label>
                <label class="option">
                    <input type="radio" name="reason" value="not-relevant">
                    <span>Content wasn't relevant to me 🎭</span>
                </label>
                <label class="option">
                    <input type="radio" name="reason" value="too-serious">
                    <span>Too serious (I need more fun!) 🎪</span>
                </label>
                <label class="option">
                    <input type="radio" name="reason" value="not-factual">
                    <span>Didn't trust the fact-checking 🔍</span>
                </label>
                <label class="option">
                    <input type="radio" name="reason" value="just-browsing">
                    <span>Just browsing, not really interested 🚶</span>
                </label>
                <label class="option">
                    <input type="radio" name="reason" value="other">
                    <span>Other reason (tell us below!) 💭</span>
                </label>
            </div>
            
            <div class="question" id="otherReasonDiv" style="display: none;">
                <label class="question-label">Tell us more! 💬</label>
                <textarea name="otherReason" rows="3" style="width: 100%; padding: 15px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 10px; color: white; font-family: 'Inter', sans-serif; font-size: 1rem; resize: vertical;" placeholder="What could we do better?"></textarea>
            </div>
            
            <div class="question">
                <label class="question-label">How likely are you to come back? 🔮</label>
                <label class="option">
                    <input type="radio" name="comeback" value="definitely" required>
                    <span>Definitely! (Just need a break) ✅</span>
                </label>
                <label class="option">
                    <input type="radio" name="comeback" value="maybe">
                    <span>Maybe (depends on improvements) 🤷</span>
                </label>
                <label class="option">
                    <input type="radio" name="comeback" value="probably-not">
                    <span>Probably not (but never say never!) 🚫</span>
                </label>
                <label class="option">
                    <input type="radio" name="comeback" value="never">
                    <span>Never (it's not you, it's me) 👋</span>
                </label>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">Submit Survey 🚀</button>
        </form>
        
        <div id="statusMessage" class="status-message"></div>
        <a href="index.html" class="back-link" id="backLink" style="display: none;">Back to Home</a>
    </div>
    
    <script>
        const form = document.getElementById('surveyForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');
        const backLink = document.getElementById('backLink');
        const otherReasonDiv = document.getElementById('otherReasonDiv');
        
        // Show other reason textarea when "other" is selected
        document.querySelectorAll('input[name="reason"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'other') {
                    otherReasonDiv.style.display = 'block';
                } else {
                    otherReasonDiv.style.display = 'none';
                }
            });
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            // Get email from URL
            const urlParams = new URLSearchParams(window.location.search);
            const encodedEmail = urlParams.get('email');
            
            const formData = new FormData(form);
            
            // Decode base64 email in browser
            let decodedEmail = null;
            if (encodedEmail) {
                try {
                    decodedEmail = atob(decodeURIComponent(encodedEmail));
                } catch (e) {
                    console.error('Error decoding email:', e);
                }
            }
            
            const surveyData = {
                email: decodedEmail,
                reason: formData.get('reason'),
                otherReason: formData.get('otherReason') || '',
                comeback: formData.get('comeback'),
            };
            
            try {
                const response = await fetch('/.netlify/functions/submit-survey', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(surveyData),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    statusMessage.className = 'status-message success show';
                    statusMessage.textContent = '✓ Thanks for your feedback! We really appreciate it. 🙏';
                    form.style.display = 'none';
                    backLink.style.display = 'inline-block';
                } else {
                    statusMessage.className = 'status-message error show';
                    statusMessage.textContent = data.error || 'Failed to submit survey. Please try again.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Survey 🚀';
                }
            } catch (error) {
                console.error('Survey submission error:', error);
                statusMessage.className = 'status-message error show';
                statusMessage.textContent = 'An error occurred. Please try again later.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Survey 🚀';
            }
        });
    </script>
    
    <!-- Background Music - Unsubscribe Theme -->
    <audio id="unsubscribeMusic" preload="auto" autoplay>
        <source src="Unsubscribed(But StillinMyHeart).mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <script>
        // Play the unsubscribe music when page loads
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('unsubscribeMusic');
            if (audio) {
                audio.volume = 0.5; // Set volume to 50%
                audio.play().catch(function(error) {
                    // Autoplay was prevented, user interaction required
                    console.log('Autoplay prevented, will play on user interaction');
                });
            }
        });
    </script>
</body>
</html>
