<head>

    <!-- Favicon and Theme -->
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="32x32">
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="192x192">
    <link rel="shortcut icon" type="image/png" href="IMG_5794.PNG">
    <link rel="apple-touch-icon" href="IMG_5794.PNG" sizes="180x180">
    <link rel="mask-icon" href="IMG_5794.PNG" color="#0f234a">
    <meta name="theme-color" content="#0f234a">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Ensure background covers entire document and prevents white overscroll */
        html {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d2d5a 100%) !important;
            min-height: 100vh;
            overflow-x: hidden;
            overscroll-behavior: none !important;
            overscroll-behavior-x: none !important;
            overscroll-behavior-y: none !important;
            -webkit-overflow-scrolling: touch;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d2d5a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .error-container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            animation: logoBounce 2s ease-in-out infinite;
        }
        
        .logo a {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @keyframes logoBounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .sorry-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 20px;
            animation: sadPulse 3s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }
        
        @keyframes sadPulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #4A90E2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #cccccc;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: #aaaaaa;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4A90E2 0%, #2A60B0 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 600px) {
            .error-container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 3rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
            <div class="error-container">
            <div class="logo">
                <a href="index.html" aria-label="Go to Noteworthy News homepage">
                    <img src="IMG_5992.PNG" alt="Noteworthy News Logo" loading="lazy">
                </a>
            </div>
            <div class="sorry-text">Sorry!</div>
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>The page you're looking for doesn't exist. It might have been moved, deleted, or you entered the wrong URL.</p>
        <div class="buttons">
                            <a href="index.html" class="btn">Go Home</a>
                            <a href="game.html" class="btn btn-secondary">Play the Game</a>
        </div>
    </div>
    
    <script>
        // Sad sound effect for 404 page
        function playSadSound() {
            try {
                // Create Web Audio API context
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Resume audio context if it's suspended (needed for autoplay policies)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        playSadTone(audioContext);
                    });
                } else {
                    playSadTone(audioContext);
                }
            } catch (error) {
                console.log('Sad sound error:', error);
            }
        }
        
        function playSadTone(audioContext) {
            // Create oscillator for the sad tone
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // Configure sad sound - descending minor third
            const duration = 1.2; // Longer, more melancholic
            const volume = 0.6; // Moderate volume
            
            // Start with a lower frequency (minor key feel)
            oscillator.type = 'sine';
            
            // Create a sad descending melody (minor third down)
            const startFreq = 330; // E4 (sad starting note)
            const endFreq = 262; // C4 (descending, melancholic)
            
            // Smooth frequency descent
            oscillator.frequency.setValueAtTime(startFreq, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(endFreq, audioContext.currentTime + duration);
            
            // Slow, sad volume envelope - gradual fade out
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.1); // Slow attack
            gainNode.gain.linearRampToValueAtTime(volume * 0.7, audioContext.currentTime + duration * 0.5); // Slight decay
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration); // Long fade out
            
            // Connect the audio chain
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Start the oscillator
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        // Play sad sound when page loads
        window.addEventListener('load', function() {
            // Small delay to ensure page is visible
            setTimeout(() => {
                playSadSound();
            }, 300);
        });
        
        // Also play on user interaction if autoplay was blocked
        document.addEventListener('click', function playOnClick() {
            playSadSound();
            document.removeEventListener('click', playOnClick);
        }, { once: true });
    </script>
    
    <!-- Background Music - Shared across all pages -->
    <audio id="backgroundMusic" preload="metadata">

    </audio>
