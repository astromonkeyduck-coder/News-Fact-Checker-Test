<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Favicon and Theme -->
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="32x32">
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="192x192">
    <link rel="shortcut icon" type="image/png" href="IMG_5794.PNG">
    <link rel="apple-touch-icon" href="IMG_5794.PNG" sizes="180x180">
    <link rel="mask-icon" href="IMG_5794.PNG" color="#0f234a">
    <title>Noteworthy News - 50 Most Populous Countries</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .geography-game-container {
            padding-top: 100px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        
        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            padding-right: 20px;
        }
        
        .home-btn-geo {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4A90E2, #2A60B0);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }
        
        .home-btn-geo:hover {
            background: linear-gradient(135deg, #5BA0F2, #3A70C0);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
        }
        
        .home-btn-geo:active {
            transform: translateY(0);
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #2A60B0;
            text-shadow: 0 2px 4px rgba(42, 96, 176, 0.3);
        }
        
        .game-stats-geo {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-item-geo {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .stat-label-geo {
            font-size: 1rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .stat-value-geo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #4A90E2;
            text-shadow: 0 2px 6px rgba(74, 144, 226, 0.6);
        }
        
        #geoScore {
            color: #FFD700;
            text-shadow: 0 2px 6px rgba(255, 215, 0, 0.6);
        }
        
        #geoCorrect {
            color: #2ECC71;
            text-shadow: 0 2px 6px rgba(46, 204, 113, 0.6);
        }
        
        #geoWrong {
            color: #E74C3C;
            text-shadow: 0 2px 6px rgba(231, 76, 60, 0.6);
        }
        
        #geoRemaining {
            color: #9B59B6;
            text-shadow: 0 2px 6px rgba(155, 89, 182, 0.6);
        }
        
        .country-prompt {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(74, 144, 226, 0.2);
            border-radius: 15px;
            border: 2px solid rgba(74, 144, 226, 0.5);
        }
        
        .world-map-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            min-height: 600px;
            max-height: 85vh;
        }
        
        .world-map {
            width: 100%;
            height: 600px;
            min-height: 400px;
            overflow: hidden;
            cursor: grab;
            position: relative;
            touch-action: none;
            background: rgba(26, 74, 138, 0.1);
        }
        
        .world-map:active {
            cursor: grabbing;
        }
        
        .world-map svg {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
            min-width: 800px;
            min-height: 400px;
            background: rgba(26, 74, 138, 0.3);
            border-radius: 10px;
            position: relative;
            transition: transform 0.1s ease-out;
            user-select: none;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        .zoom-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(74, 144, 226, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            user-select: none;
        }
        
        .zoom-btn:hover {
            background: rgba(74, 144, 226, 1);
            transform: scale(1.1);
        }
        
        .zoom-btn:active {
            transform: scale(0.95);
        }
        
        .country-path,
        path[data-country-code],
        path.non-populous {
            fill: #2ECC71;
            stroke: rgba(0, 0, 0, 0.8);
            stroke-width: 1px;
            cursor: pointer;
            transition: none !important;
            transform: none !important;
            position: static !important;
        }
        
        .country-path.correct,
        path.correct {
            fill: #FFFFFF !important;
            stroke: #E0E0E0 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 3px rgba(255, 255, 255, 0.6));
            transition: none !important;
        }
        
        .country-path.incorrect,
        path.incorrect {
            fill: #E74C3C !important;
            stroke: #C0392B !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 8px rgba(231, 76, 60, 0.8)) drop-shadow(0 0 4px rgba(231, 76, 60, 0.6));
            transition: none !important;
        }
        
        .country-path.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .country-path.non-populous,
        path.non-populous {
            fill: #0d5a2a !important; /* Dark green for non-populous countries */
            stroke: rgba(0, 0, 0, 0.8) !important;
            stroke-width: 1px !important;
            cursor: default !important;
            opacity: 0.7;
            pointer-events: auto;
        }
        
        path.non-populous:hover {
            fill: #0d5a2a !important;
            opacity: 0.8;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn-geo {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #4A90E2, #2A60B0);
            color: white;
        }
        
        .btn-geo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.4);
        }
        
        .btn-geo:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .feedback-message {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
            padding: 20px;
            border-radius: 10px;
            min-height: 50px;
        }
        
        .feedback-message.correct {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.9));
            color: #FFFFFF;
            border: 4px solid #27AE60;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.7), inset 0 0 15px rgba(46, 204, 113, 0.3);
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .feedback-message.incorrect {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.95), rgba(192, 57, 43, 0.9));
            color: #FFFFFF;
            border: 4px solid #C0392B;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.7), inset 0 0 15px rgba(231, 76, 60, 0.3);
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @media (max-width: 768px) {
            .geography-game-container {
                padding-top: 80px;
            }
            
            .game-header h1 {
                font-size: 1.8rem;
            }
            
            .country-prompt {
                font-size: 1.2rem;
                padding: 15px;
            }
            
            .stat-item-geo {
                padding: 10px 15px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="matrix-rain"></div>
    
    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="header-logo">
                    <a href="index.html" class="logo-link" aria-label="Go to Noteworthy News homepage">
                        <span class="header-logo-n">N</span><span class="header-logo-w">W</span>
                    </a>
                </div>
                <div class="brand-info">
                    <h1><span class="brand-name">Noteworthy News</span></h1>
                    <p>Geography Game</p>
                </div>
            </div>
            <div class="header-right">
                <a href="index.html" class="home-btn-geo" aria-label="Return to homepage">
                    ← Home
                </a>
            </div>
        </div>
    </header>
    
    <div class="container pixel-noise">
        <div class="geography-game-container">
            <div class="game-header">
                <h1>🌍 50 Most Populous Countries</h1>
                <p>Click on the country that's prompted. Green = not answered, White = correct, Red = incorrect | <span id="directionsCount">0 / 50</span> correct</p>
            </div>
            
            <div class="game-stats-geo">
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Score</div>
                    <div class="stat-value-geo" id="geoScore">0</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Correct</div>
                    <div class="stat-value-geo" id="geoCorrect">0 / 50</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Wrong</div>
                    <div class="stat-value-geo" id="geoWrong">0</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Remaining</div>
                    <div class="stat-value-geo" id="geoRemaining">50</div>
                </div>
            </div>
            
            <div class="country-prompt" id="countryPrompt">
                Click "Start Game" to begin!
            </div>
            
            <div class="world-map-container">
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
                    <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">−</button>
                    <button class="zoom-btn" id="resetZoom" aria-label="Reset zoom">⌂</button>
                </div>
                <div class="world-map" id="worldMap">
                    <!-- SVG map will be inserted here -->
                </div>
            </div>
            
            <div class="feedback-message" id="feedbackMessage"></div>
            
            <div class="game-controls">
                <button class="btn-geo" id="startBtn">Start Game</button>
                <button class="btn-geo" id="resetBtn" disabled>Reset Game</button>
            </div>
        </div>
    </div>
    
    <script src="geography-game.js"></script>
</body>
</html>
