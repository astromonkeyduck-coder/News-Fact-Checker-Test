<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Favicon and Theme -->
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="32x32">
    <link rel="icon" type="image/png" href="IMG_5794.PNG" sizes="192x192">
    <link rel="shortcut icon" type="image/png" href="IMG_5794.PNG">
    <link rel="apple-touch-icon" href="IMG_5794.PNG" sizes="180x180">
    <link rel="mask-icon" href="IMG_5794.PNG" color="#0f234a">
    <title>Noteworthy News - 50 Most Populous Countries</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .stars-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .floating-star {
            position: absolute;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 
                0 0 6px rgba(255, 255, 255, 0.8),
                0 0 12px rgba(255, 255, 255, 0.6),
                0 0 18px rgba(255, 255, 255, 0.4),
                0 0 24px rgba(74, 144, 226, 0.3);
            animation: floatStar linear infinite;
            opacity: 0.9;
        }
        
        @keyframes floatStar {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }
            25% {
                transform: translate(20px, -30px) scale(1.1);
                opacity: 1;
            }
            50% {
                transform: translate(-15px, -60px) scale(0.9);
                opacity: 0.7;
            }
            75% {
                transform: translate(30px, -90px) scale(1.05);
                opacity: 0.8;
            }
            100% {
                transform: translate(0, -120px) scale(1);
                opacity: 0.9;
            }
        }
        
        .geography-game-container {
            padding-top: 100px;
            max-width: 1400px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            position: relative;
            z-index: 1;
        }
        
        .container {
            position: relative;
            z-index: 1;
        }
        
        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(74, 144, 226, 0.3);
            z-index: 1000;
            padding: 0;
            height: 64px;
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 64px;
            gap: 1rem;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .header-logo {
            display: flex;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: -2px;
        }
        
        .header-logo a {
            text-decoration: none !important;
            border-bottom: none !important;
            box-shadow: none !important;
        }
        
        .header-logo a:hover,
        .header-logo a:focus,
        .header-logo a:active,
        .header-logo a:visited {
            text-decoration: none !important;
            border-bottom: none !important;
            box-shadow: none !important;
            outline: none !important;
        }
        
        .header-logo-n {
            color: white;
        }
        
        .header-logo-w {
            color: #000000;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.5), 0 0 6px rgba(255, 255, 255, 0.3);
            -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.3);
        }
        
        .brand-info {
            display: flex;
            flex-direction: column;
        }
        
        .brand-info h1 {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0;
            color: white;
        }
        
        .brand-info p {
            font-size: 0.75rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            padding-right: 20px;
        }
        
        .home-btn-geo {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4A90E2, #2A60B0);
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }
        
        .home-btn-geo:hover {
            background: linear-gradient(135deg, #5BA0F2, #3A70C0);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.5);
        }
        
        .home-btn-geo:active {
            transform: translateY(0);
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .game-header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: #2A60B0;
            text-shadow: 0 2px 4px rgba(42, 96, 176, 0.3);
        }
        
        .game-stats-geo {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-item-geo {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .stat-label-geo {
            font-size: 1rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .stat-value-geo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #4A90E2;
            text-shadow: 0 2px 6px rgba(74, 144, 226, 0.6);
        }
        
        #geoScore {
            color: #FFD700;
            text-shadow: 0 2px 6px rgba(255, 215, 0, 0.6);
        }
        
        #geoCorrect {
            color: #2ECC71;
            text-shadow: 0 2px 6px rgba(46, 204, 113, 0.6);
        }
        
        #geoWrong {
            color: #E74C3C;
            text-shadow: 0 2px 6px rgba(231, 76, 60, 0.6);
        }
        
        #geoRemaining {
            color: #9B59B6;
            text-shadow: 0 2px 6px rgba(155, 89, 182, 0.6);
        }
        
        .country-prompt {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(74, 144, 226, 0.2);
            border-radius: 15px;
            border: 2px solid rgba(74, 144, 226, 0.5);
        }
        
        .world-map-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            min-height: 600px;
            max-height: 85vh;
        }
        
        .world-map {
            width: 100%;
            height: 600px;
            min-height: 400px;
            overflow: hidden;
            cursor: grab;
            position: relative;
            touch-action: pan-x pan-y !important;
            -webkit-overflow-scrolling: touch;
            background: rgba(26, 74, 138, 0.1);
        }
        
        .world-map:active {
            cursor: grabbing;
        }
        
        .world-map svg {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(26, 74, 138, 0.3);
            border-radius: 10px;
            position: relative;
            transition: transform 0.1s ease-out;
            user-select: none;
            visibility: visible !important;
            opacity: 1 !important;
            overflow: visible;
            /* Allow SVG to be larger than container for panning */
            min-width: 100%;
            min-height: 100%;
        }
        
        .zoom-controls {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(74, 144, 226, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .zoom-btn:focus {
            outline: 2px solid rgba(74, 144, 226, 0.5);
            outline-offset: 2px;
        }
        
        .zoom-btn:hover {
            background: rgba(74, 144, 226, 1);
            transform: scale(1.1);
        }
        
        .zoom-btn:active {
            transform: scale(0.95);
        }
        
        .country-path,
        path[data-country-code],
        path.non-populous {
            fill: #2ECC71;
            stroke: rgba(0, 0, 0, 0.8);
            stroke-width: 1px;
            cursor: pointer;
            transition: none !important;
            transform: none !important;
            position: static !important;
        }
        
        .country-path.correct,
        path.correct {
            fill: #FFFFFF !important;
            stroke: #E0E0E0 !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 2px rgba(255, 255, 255, 0.3));
            transition: none !important;
        }
        
        .country-path.incorrect,
        path.incorrect {
            fill: #E74C3C !important;
            stroke: #C0392B !important;
            stroke-width: 3px !important;
            filter: drop-shadow(0 0 8px rgba(231, 76, 60, 0.8)) drop-shadow(0 0 4px rgba(231, 76, 60, 0.6));
            transition: none !important;
        }
        
        .country-path.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .country-path.non-populous,
        path.non-populous {
            fill: #0d5a2a !important; /* Dark green for non-populous countries */
            stroke: rgba(0, 0, 0, 0.8) !important;
            stroke-width: 1px !important;
            cursor: default !important;
            opacity: 0.7;
            pointer-events: auto;
        }
        
        path.non-populous:hover {
            fill: #0d5a2a !important;
            opacity: 0.8;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        
        .btn-geo {
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4A90E2, #2A60B0);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 25px rgba(74, 144, 226, 0.5),
                0 0 20px rgba(74, 144, 226, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-geo::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-geo:hover::before {
            left: 100%;
        }
        
        .btn-geo:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 12px 35px rgba(74, 144, 226, 0.6),
                0 0 30px rgba(74, 144, 226, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #5BA0F2, #3A70C0);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .btn-geo:active {
            transform: translateY(-1px) scale(1.02);
        }
        
        .btn-geo:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-geo:disabled:hover {
            transform: none;
            box-shadow: 
                0 8px 25px rgba(74, 144, 226, 0.5),
                0 0 20px rgba(74, 144, 226, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        
        .feedback-message {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 15px;
            padding: 20px;
            border-radius: 10px;
            min-height: 50px;
        }
        
        .feedback-message.correct {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.9));
            color: #FFFFFF;
            border: 4px solid #27AE60;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.7), inset 0 0 15px rgba(46, 204, 113, 0.3);
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .feedback-message.incorrect {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.95), rgba(192, 57, 43, 0.9));
            color: #FFFFFF;
            border: 4px solid #C0392B;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.7), inset 0 0 15px rgba(231, 76, 60, 0.3);
            font-weight: 900;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        @media (max-width: 768px) {
            .geography-game-container {
                padding-top: 80px;
                padding-left: 10px;
                padding-right: 10px;
            }
            
            .header-container {
                padding: 0 1rem;
            }
            
            .brand-info h1 {
                font-size: 0.85rem;
            }
            
            .brand-info p {
                font-size: 0.7rem;
            }
            
            .home-btn-geo {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .game-header h1 {
                font-size: 1.6rem;
            }
            
            .game-header p {
                font-size: 0.9rem;
                padding: 0 10px;
            }
            
            .country-prompt {
                font-size: 1.1rem;
                padding: 15px 10px;
                margin-bottom: 15px;
            }
            
            .stat-item-geo {
                padding: 10px 12px;
                min-width: 90px;
                flex: 1;
            }
            
            .stat-label-geo {
                font-size: 0.9rem;
            }
            
            .stat-value-geo {
                font-size: 1.4rem;
            }
            
            .game-stats-geo {
                gap: 10px;
                margin-bottom: 20px;
            }
            
            .world-map-container {
                padding: 10px;
                min-height: 400px;
                max-height: 60vh;
            }
            
            .world-map {
                height: 400px;
                min-height: 350px;
            }
            
            .world-map svg {
                min-width: 100%;
                min-height: 350px;
            }
            
            .zoom-controls {
                top: 15px;
                right: 15px;
                gap: 8px;
            }
            
            .zoom-btn {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }
            
            .btn-geo {
                padding: 14px 24px;
                font-size: 1.1rem;
            }
            
            .game-controls {
                gap: 12px;
                margin-top: 20px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            
            .feedback-message {
                font-size: 1.1rem;
                padding: 15px;
                margin-top: 10px;
            }
            
            .feedback-message.correct,
            .feedback-message.incorrect {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }
        }
        
        @media (max-width: 480px) {
            .geography-game-container {
                padding-top: 70px;
                padding-left: 8px;
                padding-right: 8px;
            }
            
            .header-container {
                padding: 0 0.75rem;
                height: 56px;
            }
            
            .main-header {
                height: 56px;
            }
            
            .brand-info h1 {
                font-size: 0.75rem;
            }
            
            .brand-info p {
                font-size: 0.65rem;
            }
            
            .header-logo {
                font-size: 0.9rem;
            }
            
            .home-btn-geo {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            
            .game-header h1 {
                font-size: 1.3rem;
                margin-bottom: 8px;
            }
            
            .game-header p {
                font-size: 0.8rem;
            }
            
            .country-prompt {
                font-size: 1rem;
                padding: 12px 8px;
            }
            
            .stat-item-geo {
                padding: 8px 10px;
                min-width: 75px;
            }
            
            .stat-label-geo {
                font-size: 0.8rem;
            }
            
            .stat-value-geo {
                font-size: 1.2rem;
            }
            
            .game-stats-geo {
                gap: 8px;
            }
            
            .world-map-container {
                min-height: 350px;
                max-height: 55vh;
                padding: 8px;
            }
            
            .world-map {
                height: 350px;
                min-height: 300px;
            }
            
            .world-map svg {
                min-height: 300px;
            }
            
            .zoom-controls {
                top: 10px;
                right: 10px;
                gap: 6px;
            }
            
            .zoom-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            
            .btn-geo {
                padding: 12px 20px;
                font-size: 1rem;
                width: 100%;
                max-width: 100%;
            }
            
            .game-controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .feedback-message {
                font-size: 1rem;
                padding: 12px;
            }
            
            .feedback-message.correct,
            .feedback-message.incorrect {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="matrix-rain"></div>
    <div class="stars-background" id="starsBackground"></div>
    
    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="header-logo">
                    <a href="index.html" class="logo-link" aria-label="Go to Noteworthy News homepage">
                        <span class="header-logo-n">N</span><span class="header-logo-w">W</span>
                    </a>
                </div>
                <div class="brand-info">
                    <h1><span class="brand-name">Noteworthy News</span></h1>
                    <p>Geography Game</p>
                </div>
            </div>
            <div class="header-right">
                <a href="index.html" class="home-btn-geo" aria-label="Return to homepage">
                    ← Home
                </a>
            </div>
        </div>
    </header>
    
    <div class="container pixel-noise">
        <div class="geography-game-container">
            <div class="game-header">
                <h1>🌍 50 Most Populous Countries</h1>
                <p>Click on the country that's prompted. Green = not answered, White = correct, Red = incorrect | <span id="directionsCount">0 / 50</span> correct</p>
            </div>
            
            <div class="game-stats-geo">
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Score</div>
                    <div class="stat-value-geo" id="geoScore">0</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Correct</div>
                    <div class="stat-value-geo" id="geoCorrect">0 / 50</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Wrong</div>
                    <div class="stat-value-geo" id="geoWrong">0</div>
                </div>
                <div class="stat-item-geo">
                    <div class="stat-label-geo">Remaining</div>
                    <div class="stat-value-geo" id="geoRemaining">50</div>
                </div>
            </div>
            
            <div class="country-prompt" id="countryPrompt">
                Click "Start Game" to begin!
            </div>
            
            <div class="game-controls">
                <button class="btn-geo" id="startBtn">Start Game</button>
                <button class="btn-geo" id="resetBtn" disabled>Reset Game</button>
            </div>
            
            <div class="world-map-container">
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
                    <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">−</button>
                    <button class="zoom-btn" id="resetZoom" aria-label="Reset zoom">⌂</button>
                </div>
                <div class="world-map" id="worldMap">
                    <!-- SVG map will be inserted here -->
                </div>
            </div>
            
            <div class="feedback-message" id="feedbackMessage"></div>
        </div>
    </div>
    
    <script src="geography-game.js"></script>
    <script>
        // Create floating glowing stars
        function createStars() {
            const starsContainer = document.getElementById('starsBackground');
            const numStars = 50;
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'floating-star';
                
                // Random size (small to medium)
                const size = Math.random() * 3 + 1; // 1px to 4px
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                
                // Random position
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                // Random animation duration (slow drift)
                const duration = Math.random() * 20 + 15; // 15s to 35s
                star.style.animationDuration = duration + 's';
                
                // Random delay
                star.style.animationDelay = Math.random() * 5 + 's';
                
                starsContainer.appendChild(star);
            }
        }
        
        // Initialize stars when page loads
        window.addEventListener('load', createStars);
    </script>
    
    <!-- Noteworthy Chat Widget - Shadow DOM Web Component -->
    <script src="src/widgets/noteworthy-chat.js"></script>
    <script>
        // Initialize the Shadow DOM chat widget
        (function() {
            // Wait for DOM to be ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initChat);
            } else {
                initChat();
            }
            
            function initChat() {
                console.log('Initializing Noteworthy Chat widget...');
                
                // Check if custom element is defined
                if (!customElements.get('noteworthy-chat-widget')) {
                    console.error('noteworthy-chat-widget custom element not defined! Script may not have loaded.');
                    // Retry after a short delay
                    setTimeout(() => {
                        if (customElements.get('noteworthy-chat-widget')) {
                            console.log('Custom element now defined, retrying initialization...');
                            initChat();
                        } else {
                            console.error('Custom element still not defined after retry.');
                        }
                    }, 500);
                    return;
                }
                
                try {
                    // Create and mount the Shadow DOM web component to body
                    const el = document.createElement('noteworthy-chat-widget');
                    el.setAttribute('data-endpoint', '/api/noteworthy');
                    // Set data-open="false" to start closed (set to "true" for dev/testing)
                    el.setAttribute('data-open', 'false');
                    document.body.appendChild(el);
                    console.log('Noteworthy Chat widget added to DOM');
                } catch (error) {
                    console.error('Error initializing Noteworthy Chat widget:', error);
                }
            }
        })();
    </script>
</body>
</html>
