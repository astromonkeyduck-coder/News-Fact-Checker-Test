<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Post - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #141419;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            margin-bottom: 24px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            background: #1a1a20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #D4A017;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #f44336;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #d32f2f;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        
        .message.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Remove Post from Index</h1>
        <form id="removeForm">
            <div class="form-group">
                <label for="postId">Post ID</label>
                <input 
                    type="text" 
                    id="postId" 
                    name="postId" 
                    placeholder="2000243348691640646"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">Remove Post</button>
        </form>
        <div id="message"></div>
    </div>
    
    <script>
        document.getElementById('removeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const postId = document.getElementById('postId').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            if (!postId) {
                messageDiv.innerHTML = '<div class="message error">Please enter a post ID</div>';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Removing...';
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch('/.netlify/functions/remove-post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ postId }),
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    if (data.removed) {
                        messageDiv.innerHTML = `
                            <div class="message success">
                                ✅ Post ${postId} removed successfully!<br>
                                Previous count: ${data.previousCount}<br>
                                New count: ${data.newCount}
                            </div>
                        `;
                    } else {
                        messageDiv.innerHTML = `
                            <div class="message info">
                                ℹ️ ${data.message}
                            </div>
                        `;
                    }
                } else {
                    messageDiv.innerHTML = `
                        <div class="message error">
                            ❌ Error: ${data.error || 'Failed to remove post'}
                        </div>
                    `;
                }
            } catch (error) {
                messageDiv.innerHTML = `
                    <div class="message error">
                        ❌ Network error: ${error.message}
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Remove Post';
            }
        });
    </script>
</body>
</html>
