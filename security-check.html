<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Check - Noteworthy News</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/components/security-check.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Override body styles for security check page */
        body {
            padding: 0 !important;
            padding-top: 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #07152a 0%, #0d1f3a 100%);
        }
        
        /* Hide any existing headers/navigation */
        header, nav, .header, .navigation {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Mount point for React component -->
    <div id="security-check-root"></div>
    
    <!-- React and ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Fix for Babel standalone: Define module/exports before Babel compiles
        // This prevents "exports is not defined" errors
        (function() {
            const moduleObj = { exports: {} };
            Object.defineProperty(window, 'module', {
                value: moduleObj,
                writable: true,
                configurable: true
            });
            Object.defineProperty(window, 'exports', {
                get: function() { return moduleObj.exports; },
                set: function(val) { moduleObj.exports = val; },
                configurable: true
            });
        })();
    </script>
    
    <!-- Security Config (load as regular script) -->
    <script>
        // Load security config
        window.securityConfig = {
            title: "Checking your browser before accessing Noteworthy News",
            subtitle: "For security reasons, we're making sure this request is coming from a real person and not an automated system.",
            loadingMessage: "This process usually takes just a few seconds.",
            estimatedTime: 3,
            logoUrl: "/nw-logo.GIF",
            showContactLink: true
        };
    </script>
    
    <!-- Load SecurityCheck component -->
    <script type="text/babel" src="src/components/SecurityCheck.jsx"></script>
    <script>
        // Extract SecurityCheck from module.exports after Babel compilation
        (function() {
            function extractSecurityCheck() {
                if (typeof module !== 'undefined' && module.exports) {
                    const exported = module.exports.default || module.exports.SecurityCheck || module.exports;
                    if (exported && typeof exported === 'function') {
                        window.SecurityCheck = exported;
                    }
                }
                // Also check if it's already global
                if (typeof SecurityCheck !== 'undefined' && typeof SecurityCheck === 'function' && !window.SecurityCheck) {
                    window.SecurityCheck = SecurityCheck;
                }
            }
            // Try multiple times as Babel compilation is async
            extractSecurityCheck();
            setTimeout(extractSecurityCheck, 100);
            setTimeout(extractSecurityCheck, 300);
            setTimeout(extractSecurityCheck, 500);
        })();
    </script>
    
    <!-- Initialize Security Check -->
    <script type="text/babel">
        const { createRoot } = ReactDOM;
        
        // Get return path from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const returnPath = urlParams.get('return') || '/';
        
        // Initialize component
        function initSecurityCheck() {
            const rootElement = document.getElementById('security-check-root');
            if (!rootElement) {
                console.error('Security check root element not found');
                return;
            }
            
            const root = createRoot(rootElement);
            
            // Handle verification completion
            const handleVerified = () => {
                console.log('[Security Check] Verification complete, redirecting to:', returnPath);
                
                // Store verification token in sessionStorage (for route protection)
                sessionStorage.setItem('security-check-verified', 'true');
                sessionStorage.setItem('security-check-timestamp', Date.now().toString());
                
                // Redirect to original path
                window.location.href = returnPath;
            };
            
            root.render(
                React.createElement(SecurityCheck, {
                    onVerified: handleVerified
                })
            );
        }
        
        // Wait for React and component to load with error handling
        function tryInitSecurityCheck() {
            try {
                // Check if React is loaded
                if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                    // Retry after a delay if React isn't loaded yet
                    setTimeout(tryInitSecurityCheck, 200);
                    return;
                }
                
                // Check if SecurityCheck component is available (might be loaded via Babel)
                if (typeof SecurityCheck === 'undefined') {
                    // Retry after a delay if component isn't loaded yet
                    setTimeout(tryInitSecurityCheck, 200);
                    return;
                }
                
                initSecurityCheck();
            } catch (error) {
                console.error('Error initializing security check:', error);
                // Fallback: show a simple message and auto-redirect after 3 seconds
                const rootElement = document.getElementById('security-check-root');
                if (rootElement) {
                    rootElement.innerHTML = `
                        <div style="text-align: center; color: white; padding: 2rem;">
                            <h1>Checking your browser...</h1>
                            <p>Please wait while we verify your request.</p>
                            <div style="margin: 2rem 0;">
                                <div style="width: 48px; height: 48px; border: 4px solid rgba(74, 144, 226, 0.2); border-top: 4px solid #4A90E2; border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite;"></div>
                            </div>
                        </div>
                        <style>
                            @keyframes spin {
                                0% { transform: rotate(0deg); }
                                100% { transform: rotate(360deg); }
                            }
                        </style>
                    `;
                    // Auto-redirect after 3 seconds as fallback
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnPath = urlParams.get('return') || '/';
                        sessionStorage.setItem('security-check-verified', 'true');
                        sessionStorage.setItem('security-check-timestamp', Date.now().toString());
                        window.location.href = returnPath;
                    }, 3000);
                }
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(tryInitSecurityCheck, 100);
            });
        } else {
            setTimeout(tryInitSecurityCheck, 100);
        }
    </script>
</body>
</html>
