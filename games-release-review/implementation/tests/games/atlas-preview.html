<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas development playtest</title><link rel="stylesheet" href="/games/base.css"><link rel="stylesheet" href="/games/atlas.css?edition=touch-targets"><style>body{margin:0;padding:16px;background:#071522;color:#eef1ef;font-family:Arial,sans-serif}nav{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 14px}a{color:#69d5c6}#test-status{font-size:12px;color:#a7b7c4}#app{max-width:1400px;margin:auto}</style></head><body><nav aria-label="Development mode selection"><a href="?mode=expedition">Expedition</a><a href="?mode=classic">Classic 50</a><a href="?mode=hard">Hard</a><a href="?mode=typing">Typing</a><a href="?mode=reasoning">Reasoning</a><button id="restart">Restart this test run</button></nav><p id="test-status">Development playtest · only the named Atlas test save is used.</p><div id="app"></div><script src="/games/data/atlas-data.js"></script><script src="/games/atlas.js"></script><script src="/games/atlas-ui.js"></script><script>const mode=new URLSearchParams(location.search).get('mode')||'expedition',key='noteworthy-atlas-development-test-'+mode;let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch{}const mount=()=>NoteworthyAtlasUI.mount(document.getElementById('app'),{mode,seed:'atlas-first-expedition',saved,onSave(state){localStorage.setItem(key,JSON.stringify(state));document.getElementById('test-status').textContent='Development playtest · saved '+state.status+' · target '+(state.index+1);},onFinish(result){document.getElementById('test-status').textContent='Completed '+result.mode+': '+result.score+'/'+result.maxScore+' · '+result.correct+'/'+result.total+' found.'}});let current=mount();document.getElementById('restart').onclick=()=>{current.destroy();localStorage.removeItem(key);saved=null;current=mount();};</script></body></html>
