[functions]
  # Use esbuild to automatically compile TypeScript functions
  node_bundler = "esbuild"
  # Include source files for TypeScript compilation and JavaScript RSS modules
  included_files = ["netlify/functions/**/*.ts", "src/**/*.ts", "src/rss/**/*.js", "netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]
  # Also include JavaScript functions
  directory = "netlify/functions"

# article-preview function needs access to article.html template
[functions."article-preview"]
  included_files = ["article.html"]

# Configure process-job as background function (longer timeout for ffmpeg processing)
# Background functions can run up to 15 minutes (vs 26 seconds for regular functions)
[functions."process-job"]
  node_bundler = "zisi"  # Use zisi to handle native ffmpeg-static binary
  included_files = ["node_modules/ffmpeg-static/**"]
  # Note: Background function configuration is also in the function file itself (exports.config)

# Configure transcribe-from-url with longer timeout for large files
[functions."transcribe-from-url"]
  timeout = 26  # Maximum timeout for Netlify Functions (26 seconds for Pro, 10 for free)

# Configure analyze-transcript with maximum timeout
# AI analysis with context files can take time, so we use the maximum allowed timeout
[functions."analyze-transcript"]
  timeout = 26  # Maximum timeout for Netlify Functions (26 seconds for Pro, 10 for free)
  node_bundler = "esbuild"

# Configure functions that use native modules (@resvg/resvg-js)
# These functions need native .node binaries which esbuild can't bundle
# Use zisi (zip-it-and-ship-it) bundler which properly handles native .node modules
[functions."generate-earthquake-image"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native modules
  included_files = ["netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]

[functions."generate-earthquake-animation"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native modules (uses generate-earthquake-image)
  included_files = ["netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]

[functions."generate-earthquake-video"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native .node modules
  included_files = ["netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]
  timeout = 26  # Max for Netlify sync (Pro); keep under to avoid 504

[functions."test-generate"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native modules

# ingest-all and retry-usgs-images import engines/usgs which imports generate-earthquake-image
# So they also need zisi bundler to handle native modules
[functions."ingest-all"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native modules
  included_files = ["netlify/functions/engines/**", "netlify/functions/lib/**", "netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]
  schedule = "*/5 * * * *"  # Runs every 5 minutes to ingest events from all enabled engines

[functions."retry-usgs-images"]
  node_bundler = "zisi"  # Use zip-it-and-ship-it which handles native modules
  included_files = ["netlify/functions/engines/**", "netlify/functions/lib/**", "netlify/functions/**/*.png", "netlify/functions/fonts-base64.js"]
  schedule = "* * * * *"  # Runs every minute to retry USGS images for high-magnitude earthquakes

[dev]
  # Load .env file for local development
  command = "netlify dev"
  port = 8888

# Scheduled Functions
# ingest-live-events runs every 5 minutes to pull fresh events
# IMPORTANT: Configure the schedule in Netlify Dashboard after deployment:
# 1. Go to Netlify Dashboard → Your Site → Functions
# 2. Find "ingest-live-events"
# 3. Click "Schedule" tab
# 4. Set schedule to: */5 * * * * (every 5 minutes)
# 
# Alternatively, you can trigger it manually via:
# curl -X POST https://your-site.netlify.app/.netlify/functions/ingest-live-events
#
# Note: The schedule property below may not work without a plugin in some Netlify plans.
# Use the Dashboard UI to configure scheduling instead.

# Security headers to prevent unwanted iframe embedding and improve security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# Stricter headers for game.html to prevent iframe embedding
[[headers]]
  for = "/game.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'self'"

# Hide Clemens Converter from search engines
[[headers]]
  for = "/clemensconverter/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
