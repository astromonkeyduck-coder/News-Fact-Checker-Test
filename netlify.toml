[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."
  
# Environment variables for Auth0 will be injected during build
# Set AUTH0_DOMAIN and AUTH0_CLIENT_ID in Netlify Dashboard → Site Settings → Environment Variables

# Configure secrets scanning to allow Auth0 credentials in client-side code
# Auth0 Client ID and Domain are meant to be public in SPA applications
# R2_BUCKET is not a secret - it's just a bucket name (public configuration)
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AUTH0_DOMAIN,AUTH0_CLIENT_ID,R2_BUCKET"
  NODE_VERSION = "20"
  BUGSNAG_DISABLE_AUTOMATIC_REPORTING = "true"
  ENABLE_HEADLESS_BROWSER = "true"

# Netlify automatically serves 404.html for 404 errors
# Make sure 404.html is in the root directory (publish directory)

# Favicon redirect (browsers request /favicon.ico by default)
[[redirects]]
  from = "/favicon.ico"
  to = "/IMG_5794.PNG"
  status = 200

# KONSCIOUS page redirects (case-insensitive)
[[redirects]]
  from = "/Koncious"
  to = "/KONSCIOUS/"
  status = 301

[[redirects]]
  from = "/Koncious/*"
  to = "/KONSCIOUS/:splat"
  status = 301

[[redirects]]
  from = "/koncious"
  to = "/KONSCIOUS/"
  status = 301

[[redirects]]
  from = "/koncious/*"
  to = "/KONSCIOUS/:splat"
  status = 301

[[redirects]]
  from = "/konscious"
  to = "/KONSCIOUS/"
  status = 301

[[redirects]]
  from = "/konscious/*"
  to = "/KONSCIOUS/:splat"
  status = 301

[[redirects]]
  from = "/api/noteworthy"
  to = "/.netlify/functions/noteworthy-chat"
  status = 200
  force = false
  headers = { X-From = "/api/noteworthy" }

[[redirects]]
  from = "/datalogging"
  to = "/admin-analytics.html"
  status = 200
  force = false

[[redirects]]
  from = "/admin"
  to = "/admin-newsletter.html"
  status = 200
  force = false

[[redirects]]
  from = "/adminnewsletter"
  to = "/admin-newsletter.html"
  status = 200
  force = false

# Route ALL article.html requests to article-preview.js (force=true to override static file)
# article-preview.js serves pre-rendered HTML for crawlers, interactive page for regular users
[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article-preview"
  status = 200
  force = true

# Also support /article (no extension) for cleaner sharing URLs
[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article-preview"
  status = 200
  force = true

# Clemens Converter API routes
[[redirects]]
