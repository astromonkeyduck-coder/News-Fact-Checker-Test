[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."
  
# Environment variables for Auth0 will be injected during build
# Set AUTH0_DOMAIN and AUTH0_CLIENT_ID in Netlify Dashboard → Site Settings → Environment Variables
# Admin API routes: set ADMIN_EMAILS (comma-separated) for extra admins; mr.pangolinman@gmail.com
# is always allowlisted in requireAuth.js (see netlify/functions/middleware/requireAuth.js).

# Configure secrets scanning to allow Auth0 credentials in client-side code
# Auth0 Client ID and Domain are meant to be public in SPA applications
# R2_BUCKET is not a secret - it's just a bucket name (public configuration)
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AUTH0_DOMAIN,AUTH0_CLIENT_ID,R2_BUCKET,NEWSLETTER_KEY"
  # Xcode project must not commit DEVELOPMENT_TEAM (matches APNS_TEAM_ID). Omit ios/
  # so a local Xcode save doesn't block website deploys; set Team in Xcode locally only.
  SECRETS_SCAN_OMIT_PATHS = "ios/**"
  NODE_VERSION = "20"
  # Disable auto earthquake email alerts until ready (set to "false" to re-enable)
  EARTHQUAKE_EMAIL_ALERTS_DISABLED = "true"
  BUGSNAG_DISABLE_AUTOMATIC_REPORTING = "true"
  ENABLE_HEADLESS_BROWSER = "true"

# Netlify automatically serves 404.html for 404 errors
# Make sure 404.html is in the root directory (publish directory)

# ── V2 Homepage Cutover (ACTIVE) ───────────────────────────────────
# Serves V2 homepage at /. V2 uses absolute asset paths
# (/v2/styles/..., /v2/js/...) so the rewrite is transparent.
# V1 index.html remains accessible at /index.html as a fallback.
# Rollback: comment out the rewrite below and redeploy.
[[redirects]]
  from = "/"
  to = "/v2/index.html"
  status = 200
  force = true

# TEMPORARY - Situation Monitor disabled until re-enabled
[[redirects]]
  from = "/situation-monitor.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/v2/situation-monitor.html"
  to = "/"
  status = 302
  force = true
# ────────────────────────────────────────────────────────────────────

# Live Story deep links - /story/<slug> serves story.html (clean URLs for push)
# 200 rewrite keeps the slug in the address bar; live-story.js parses it.
[[redirects]]
  from = "/story/*"
  to = "/story.html"
  status = 200

# Category page - /category and /category?country=... -> /category/
[[redirects]]
