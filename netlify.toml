[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."
  
# Environment variables for Auth0 will be injected during build
# Set AUTH0_DOMAIN and AUTH0_CLIENT_ID in Netlify Dashboard → Site Settings → Environment Variables

# Configure secrets scanning to allow Auth0 credentials in client-side code
# Auth0 Client ID and Domain are meant to be public in SPA applications
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AUTH0_DOMAIN,AUTH0_CLIENT_ID"
  NODE_VERSION = "20"

# Netlify automatically serves 404.html for 404 errors
# Make sure 404.html is in the root directory (publish directory)

[[redirects]]
  from = "/api/noteworthy"
  to = "/.netlify/functions/noteworthy-chat"
  status = 200
  force = false
  headers = { X-From = "/api/noteworthy" }

[[redirects]]
  from = "/datalogging"
  to = "/admin-analytics.html"
  status = 200
  force = false

[[redirects]]
  from = "/admin"
  to = "/admin-newsletter.html"
  status = 200
  force = false

[[redirects]]
  from = "/adminnewsletter"
  to = "/admin-newsletter.html"
  status = 200
  force = false

[functions]
  # Use esbuild to automatically compile TypeScript functions
  node_bundler = "esbuild"
  # Include source files for TypeScript compilation
  included_files = ["netlify/functions/**/*.ts", "src/**/*.ts", "netlify/functions/**/*.png"]
  # Also include JavaScript functions
  directory = "netlify/functions"

# Scheduled function: ingest-all
# Runs every 5 minutes to ingest events from all enabled engines
[functions."ingest-all"]
  schedule = "*/5 * * * *"

[dev]
  # Load .env file for local development
  command = "netlify dev"
  port = 8888

# Scheduled Functions
# ingest-live-events runs every 5 minutes to pull fresh events
# IMPORTANT: Configure the schedule in Netlify Dashboard after deployment:
# 1. Go to Netlify Dashboard → Your Site → Functions
# 2. Find "ingest-live-events"
# 3. Click "Schedule" tab
# 4. Set schedule to: */5 * * * * (every 5 minutes)
# 
# Alternatively, you can trigger it manually via:
# curl -X POST https://your-site.netlify.app/.netlify/functions/ingest-live-events
#
# Note: The schedule property below may not work without a plugin in some Netlify plans.
# Use the Dashboard UI to configure scheduling instead.

# Security headers to prevent unwanted iframe embedding and improve security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=()"

# Stricter headers for game.html to prevent iframe embedding
[[headers]]
  for = "/game.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'self'"

