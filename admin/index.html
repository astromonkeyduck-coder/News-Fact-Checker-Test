<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0B1426">

  <!-- Fonts (same as V2 public) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">

  <!-- V2 Design Tokens + Admin Styles -->
  <link rel="stylesheet" href="/v2/styles/tokens.css">
  <link rel="stylesheet" href="/v2/styles/base.css">
  <link rel="stylesheet" href="css/admin.css">

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <!-- Auth0 Configuration - Inject environment variables for production -->
    <script>
      window.AUTH0_DOMAIN = null;
      window.AUTH0_CLIENT_ID = null;
    </script>
  <!-- /Auth0 Configuration -->
</head>
<body>

  <!-- ─── Auth Screen (shown until admin verified) ── -->
  <div id="admin-auth-screen" class="admin-auth-screen">
    <div>
      <h1 style="font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:var(--space-lg);text-align:center">
        Noteworthy News Admin
      </h1>
      <p id="admin-auth-status" class="auth-status">Loading&hellip;</p>
    </div>
  </div>

  <!-- ─── Admin Shell (hidden until auth confirmed) ── -->
  <div id="admin-shell" class="admin-shell">

    <!-- Top Bar -->
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:var(--space-md)">
        <button class="admin-btn admin-btn-sm admin-btn-secondary" id="admin-mobile-menu" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="admin-topbar-title">Noteworthy Admin</span>
      </div>
      <div class="admin-topbar-right">
        <span class="admin-user-label" id="admin-user-label"></span>
        <button class="admin-logout-btn" id="admin-logout-btn">Sign Out</button>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <nav class="admin-nav" aria-label="Admin sections">

        <a href="#posts" class="admin-nav-item" data-section="posts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Posts
        </a>

        <a href="#live-stories" class="admin-nav-item" data-section="live-stories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 010 8.49M7.76 16.24a6 6 0 010-8.49M19.07 4.93a10 10 0 010 14.14M4.93 19.07a10 10 0 010-14.14"/></svg>
          Live Stories
        </a>

        <a href="#ingestion" class="admin-nav-item" data-section="ingestion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
          Ingestion
        </a>

        <a href="#newsletter" class="admin-nav-item" data-section="newsletter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Newsletter
        </a>

        <a href="#watermarker" class="admin-nav-item" data-section="watermarker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Video Watermarker
        </a>

        <div class="admin-nav-divider"></div>

        <a href="#analytics" class="admin-nav-item" data-section="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </a>

        <a href="#system" class="admin-nav-item" data-section="system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.32 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          System
        </a>

        <div class="admin-nav-divider"></div>

        <a href="/" class="admin-nav-item" style="color:var(--color-text-muted)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          Back to Site
        </a>

      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main" id="admin-main">
      <div class="admin-loading">Loading&hellip;</div>
    </main>

  </div>

  <!-- Boot -->
  <script type="module">
    import { boot } from './js/admin-app.js';
    boot();
  </script>


</body>
</html>
