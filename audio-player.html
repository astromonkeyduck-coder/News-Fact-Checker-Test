<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noteworthy News - Maintenance Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .player-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .player-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .player-header h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .player-header p {
            color: #b3b3b3;
            font-size: 14px;
        }
        
        .audio-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1db954;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }
        
        .play-button:hover {
            transform: scale(1.1);
            background: #1ed760;
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.6);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        .play-icon {
            width: 0;
            height: 0;
            border-left: 20px solid #000;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }
        
        .pause-icon {
            width: 24px;
            height: 24px;
            background: #000;
            position: relative;
        }
        
        .pause-icon::before,
        .pause-icon::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 24px;
            background: #000;
        }
        
        .pause-icon::before {
            left: 4px;
        }
        
        .pause-icon::after {
            right: 4px;
        }
        
        .progress-container {
            width: 100%;
            position: relative;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #404040;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress-fill {
            height: 100%;
            background: #1db954;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            color: #b3b3b3;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        
        .volume-icon {
            color: #b3b3b3;
            font-size: 18px;
        }
        
        .volume-slider {
            flex: 1;
            height: 4px;
            background: #404040;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
        }
        
        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1db954;
            cursor: pointer;
            border: none;
        }
        
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <h1>Noteworthy News</h1>
            <p>Maintenance Mode Audio</p>
        </div>
        
        <div class="audio-controls">
            <button class="play-button" id="playPauseBtn">
                <div class="play-icon" id="playIcon"></div>
            </button>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
            
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            </div>
        </div>
        
        <audio id="audioPlayer" src="MSCREEN.wav" preload="auto"></audio>
    </div>
    
    <script>
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeDisplay = document.getElementById('currentTime');
        const totalTimeDisplay = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        
        let isPlaying = false;
        
        // Format time
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Update progress bar
        function updateProgress() {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = progress + '%';
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
            }
        }
        
        // Play/Pause toggle
        playPauseBtn.addEventListener('click', function() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                playIcon.parentElement.querySelector('.pause-icon')?.remove();
            } else {
                audio.play();
                isPlaying = true;
                playIcon.style.display = 'none';
                const pauseIcon = document.createElement('div');
                pauseIcon.className = 'pause-icon';
                playPauseBtn.appendChild(pauseIcon);
            }
        });
        
        // Progress bar click
        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            audio.currentTime = percentage * audio.duration;
        });
        
        // Volume control
        volumeSlider.addEventListener('input', function() {
            audio.volume = this.value / 100;
        });
        
        // Update time displays
        audio.addEventListener('loadedmetadata', function() {
            totalTimeDisplay.textContent = formatTime(audio.duration);
        });
        
        audio.addEventListener('timeupdate', updateProgress);
        
        audio.addEventListener('ended', function() {
            isPlaying = false;
            playIcon.style.display = 'block';
            playPauseBtn.querySelector('.pause-icon')?.remove();
            progressFill.style.width = '0%';
            currentTimeDisplay.textContent = '0:00';
        });
        
        // Set initial volume
        audio.volume = 0.7;
    </script>
</body>
</html>
