<!DOCTYPE html>

    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #333;
        }
        .placeholder {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        }
        .placeholder p {

            line-height: 1.6;
            opacity: 0.9;
        }
        .note {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>

<body>
    <div class="placeholder">
