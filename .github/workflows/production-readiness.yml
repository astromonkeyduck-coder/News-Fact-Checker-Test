name: Production Readiness Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Build, security, accessibility, and runtime audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH0_DOMAIN: ci-placeholder.auth0.com
      AUTH0_CLIENT_ID: ci-placeholder-client
      AUTH0_AUDIENCE: https://noteworthynews.co/api
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Inventory the production surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY' | tee audit-artifacts/inventory.txt
          import collections
          import os
          import pathlib
          import subprocess

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          extensions = collections.Counter()
          roots = collections.Counter()
          source_lines = []
          source_exts = {
              ".js", ".cjs", ".mjs", ".ts", ".tsx", ".jsx", ".html",
              ".css", ".scss", ".swift", ".py", ".sh", ".sql", ".toml",
              ".yml", ".yaml", ".json", ".md"
          }
          for name in files:
              path = pathlib.Path(name)
              extensions[path.suffix.lower() or "[none]"] += 1
              roots[path.parts[0] if path.parts else "[root]"] += 1
              if path.suffix.lower() not in source_exts:
                  continue
              try:
                  size = path.stat().st_size
                  if size > 5_000_000:
                      continue
                  with path.open("r", encoding="utf-8", errors="ignore") as handle:
                      line_count = sum(1 for _ in handle)
                  source_lines.append((line_count, name))
              except OSError:
                  pass

          print(f"tracked_files={len(files)}")
          print("\nTop-level entries by tracked file count:")
          for name, count in roots.most_common(30):
              print(f"{count:6d}  {name}")
          print("\nExtensions:")
          for ext, count in extensions.most_common(30):
              print(f"{count:6d}  {ext}")
          print("\nLargest source/config files by line count:")
          for lines, name in sorted(source_lines, reverse=True)[:40]:
              print(f"{lines:8d}  {name}")
          PY
          {
            echo
            echo "Largest tracked blobs in HEAD:"
            git ls-tree -r -l HEAD | sort -k4 -nr | head -40
          } | tee -a audit-artifacts/inventory.txt

      - name: Install dependencies reproducibly
        id: install
        shell: bash
        run: |
          set +e
          npm ci --ignore-scripts > audit-artifacts/npm-ci.log 2>&1
          status=$?
          echo "$status" > audit-artifacts/npm-ci.status
          tail -n 120 audit-artifacts/npm-ci.log
          exit "$status"

      - name: Audit dependency vulnerabilities
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit-artifacts/npm-audit.json 2> audit-artifacts/npm-audit.stderr
          status=$?
          echo "$status" > audit-artifacts/npm-audit.status
          node <<'NODE'
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('audit-artifacts/npm-audit.json', 'utf8'));
            const vulnerabilities = report.metadata?.vulnerabilities || {};
            console.log('Production dependency vulnerabilities:', vulnerabilities);
            const advisories = Object.entries(report.vulnerabilities || {})
              .filter(([, value]) => ['high', 'critical'].includes(value.severity))
              .map(([name, value]) => ({
                name,
                severity: value.severity,
                direct: value.isDirect,
                range: value.range,
                fixAvailable: value.fixAvailable,
              }));
            console.log(JSON.stringify(advisories, null, 2));
          } catch (error) {
            console.error('Unable to parse npm audit report:', error.message);
          }
          NODE
          exit 0

      - name: Build the deployable site
        if: always() && steps.install.outcome == 'success'
        id: build
        shell: bash
        run: |
          set +e
          npm run build > audit-artifacts/build.log 2>&1
          status=$?
          echo "$status" > audit-artifacts/build.status
          tail -n 160 audit-artifacts/build.log
          exit 0

      - name: Type-check TypeScript
        if: always() && steps.install.outcome == 'success'
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > audit-artifacts/typecheck.log 2>&1
          status=$?
          echo "$status" > audit-artifacts/typecheck.status
          tail -n 160 audit-artifacts/typecheck.log
          exit 0

      - name: Run available repository checks
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          : > audit-artifacts/repository-checks.log
          for command in \
            "npm run validate:games" \
            "npm run audit:game" \
            "npm run test:games -- --runInBand"; do
            echo "===== $command =====" | tee -a audit-artifacts/repository-checks.log
            bash -lc "$command" >> audit-artifacts/repository-checks.log 2>&1
            echo "exit=$?" | tee -a audit-artifacts/repository-checks.log
          done
          tail -n 220 audit-artifacts/repository-checks.log
          exit 0

      - name: Analyze server trust boundaries and secret exposure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' | tee audit-artifacts/security-analysis.txt
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8' })
            .split(/\r?\n/)
            .filter(Boolean);
          const textExts = new Set([
            '.js', '.cjs', '.mjs', '.ts', '.tsx', '.jsx', '.html', '.css',
            '.json', '.toml', '.yml', '.yaml', '.md', '.txt', '.swift', '.sql',
            '.xml', '.plist', '.pbxproj', '.entitlements', '.sh', '.py'
          ]);
          const readText = (file) => {
            try {
              const stat = fs.statSync(file);
              if (stat.size > 5_000_000 || !textExts.has(path.extname(file).toLowerCase())) return '';
              return fs.readFileSync(file, 'utf8');
            } catch {
              return '';
            }
          };

          const functions = tracked.filter((file) => /^netlify\/functions\/[^/]+\.(?:js|ts)$/.test(file));
          const mutationMarkers = /(?:httpMethod|method)[^\n]{0,80}(?:POST|PUT|PATCH|DELETE)|\.(?:setJSON|set|delete|deleteAll|insert|upsert|update)\s*\(|resend\.emails\.send|sendNotification\s*\(|openai\.|new\s+OpenAI\s*\(/i;
          const authMarkers = /requireAdminAuth|requireAdminAuthOrSecret|requireAuth\s*\(|verifyToken\s*\(|isAdminSecretValid|timingSafeEqual|CRON_SECRET|WEBHOOK_SECRET|x-api-key|authorization/i;
          const publicMutationCandidates = [];
          const wildcardCorsAuthenticated = [];
          const missingMethodGuards = [];

          for (const file of functions) {
            const text = readText(file);
            if (!text) continue;
            const mutates = mutationMarkers.test(text);
            const authenticated = authMarkers.test(text);
            if (mutates && !authenticated) publicMutationCandidates.push(file);
            if (authenticated && /Access-Control-Allow-Origin["']?\s*:\s*["']\*["']/.test(text)) {
              wildcardCorsAuthenticated.push(file);
            }
            if (mutates && !/(?:httpMethod|method)|schedule|scheduled/i.test(text)) {
              missingMethodGuards.push(file);
            }
          }

          const clientFiles = tracked.filter((file) => /^(?:v2|src|js|assets|admin|category|public)\//.test(file));
          const serverSecretNames = /SUPABASE_SERVICE_ROLE|OPENAI_API_KEY|RESEND_API_KEY|APNS_PRIVATE_KEY|VAPID_PRIVATE_KEY|AWS_SECRET_ACCESS_KEY|NEWSLETTER_KEY|ADMIN_TOKEN|CRON_SECRET/;
          const clientSecretReferences = clientFiles.filter((file) => serverSecretNames.test(readText(file)));

          const secretSignatures = [
            ['private-key', /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/],
            ['aws-access-key', /\bAKIA[0-9A-Z]{16}\b/],
            ['openai-key', /\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b/],
            ['github-token', /\bgh[pousr]_[A-Za-z0-9]{30,}\b/],
            ['resend-key', /\bre_[A-Za-z0-9_-]{20,}\b/],
          ];
          const possibleSecrets = [];
          for (const file of tracked) {
            const text = readText(file);
            if (!text) continue;
            for (const [kind, regex] of secretSignatures) {
              if (regex.test(text)) possibleSecrets.push({ kind, file });
            }
          }

          const netlify = readText('netlify.toml');
          const configFindings = [];
          const omitLine = netlify.match(/SECRETS_SCAN_OMIT_KEYS\s*=\s*"([^"]*)"/);
          if (omitLine) {
            const omitted = omitLine[1].split(',').map((value) => value.trim()).filter(Boolean);
            const risky = omitted.filter((name) => /KEY|TOKEN|SECRET|PASSWORD/i.test(name) && !/AUTH0_CLIENT_ID/i.test(name));
            if (risky.length) configFindings.push(`Secret scanning is suppressed for secret-like keys: ${risky.join(', ')}`);
          }
          if (!/Strict-Transport-Security/i.test(netlify)) configFindings.push('No HSTS header is configured.');
          if (!/Content-Security-Policy\s*=/i.test(netlify)) configFindings.push('No site-wide enforcing CSP is configured.');

          const authMiddleware = readText('netlify/functions/middleware/requireAuth.js');
          if (/BUILTIN_ADMIN_EMAILS/.test(authMiddleware)) configFindings.push('Admin identities are hard-coded in the public repository.');
          if (/queryStringParameters\?\.token/.test(authMiddleware)) configFindings.push('Legacy admin secrets are still accepted through query strings.');
          if (/AUTH0_CLIENT_ID[\s\S]{0,500}verifyOptions\.audience/.test(authMiddleware)) configFindings.push('General API token verification accepts the SPA client_id audience (ID-token compatibility).');

          console.log(`Netlify function handlers: ${functions.length}`);
          console.log('\nMutation/cost candidates without an obvious auth marker (manual review required):');
          console.log(publicMutationCandidates.length ? publicMutationCandidates.join('\n') : 'none');
          console.log('\nAuthenticated handlers with local wildcard CORS declarations:');
          console.log(wildcardCorsAuthenticated.length ? wildcardCorsAuthenticated.join('\n') : 'none');
          console.log('\nMutation candidates without an obvious method/schedule guard:');
          console.log(missingMethodGuards.length ? missingMethodGuards.join('\n') : 'none');
          console.log('\nServer-only secret names referenced from client directories:');
          console.log(clientSecretReferences.length ? clientSecretReferences.join('\n') : 'none');
          console.log('\nPossible committed secret signatures (values redacted):');
          console.log(possibleSecrets.length ? JSON.stringify(possibleSecrets, null, 2) : 'none');
          console.log('\nConfiguration/authentication findings:');
          console.log(configFindings.length ? configFindings.map((item) => `- ${item}`).join('\n') : 'none');

          fs.writeFileSync('audit-artifacts/security-analysis.json', JSON.stringify({
            functionCount: functions.length,
            publicMutationCandidates,
            wildcardCorsAuthenticated,
            missingMethodGuards,
            clientSecretReferences,
            possibleSecrets,
            configFindings,
          }, null, 2));
          NODE

      - name: Audit homepage runtime, accessibility, and mobile layout
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          echo "chrome=$CHROME_BIN"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome is unavailable; browser audit skipped." | tee audit-artifacts/browser-audit.txt
            exit 0
          fi

          npm install --no-save --ignore-scripts axe-core@4.10.3 >> audit-artifacts/browser-install.log 2>&1
          python3 -m http.server 4173 --bind 127.0.0.1 > audit-artifacts/static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2

          CHROME_BIN="$CHROME_BIN" node <<'NODE' | tee audit-artifacts/browser-audit.txt
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const executablePath = process.env.CHROME_BIN;
            const browser = await puppeteer.launch({
              executablePath,
              headless: 'new',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });

            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => pageErrors.push(error.message));
            page.on('requestfailed', (request) => {
              const url = request.url();
              if (!url.startsWith('data:')) failedRequests.push({ url, error: request.failure()?.errorText });
            });

            await page.goto('http://127.0.0.1:4173/v2/index.html', {
              waitUntil: 'domcontentloaded',
              timeout: 45_000,
            });
            await new Promise((resolve) => setTimeout(resolve, 4_000));

            const layout = await page.evaluate(() => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.visibility !== 'hidden' && style.display !== 'none' && rect.width > 0 && rect.height > 0;
              };
              const controls = [...document.querySelectorAll('a, button, input, select, textarea, [role="button"]')]
                .filter(visible)
                .map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName.toLowerCase(),
                    text: (element.getAttribute('aria-label') || element.textContent || element.getAttribute('placeholder') || '').trim().slice(0, 80),
                    width: Math.round(rect.width),
                    height: Math.round(rect.height),
                  };
                });
              const newsletterForms = [...document.querySelectorAll('form')].filter((form) => /newsletter|subscribe|email/i.test(`${form.id} ${form.className} ${form.textContent}`));
              return {
                title: document.title,
                lang: document.documentElement.lang,
                viewportMeta: document.querySelector('meta[name="viewport"]')?.content || null,
                hasMain: Boolean(document.querySelector('main')),
                h1Count: document.querySelectorAll('h1').length,
                horizontalOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                smallTouchTargets: controls.filter((item) => item.width < 44 || item.height < 44).slice(0, 60),
                newsletterForms: newsletterForms.map((form) => ({
                  id: form.id || null,
                  action: form.getAttribute('action'),
                  method: form.getAttribute('method'),
                  emailInputs: form.querySelectorAll('input[type="email"]').length,
                  labelledEmailInputs: [...form.querySelectorAll('input[type="email"]')].filter((input) => input.labels?.length || input.getAttribute('aria-label')).length,
                })),
              };
            });

            await page.addScriptTag({ path: require.resolve('axe-core/axe.min.js') });
            const axe = await page.evaluate(async () => {
              const result = await axe.run(document, {
                runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] },
              });
              return result.violations.map((violation) => ({
                id: violation.id,
                impact: violation.impact,
                description: violation.description,
                nodes: violation.nodes.slice(0, 8).map((node) => ({ target: node.target, failureSummary: node.failureSummary })),
                nodeCount: violation.nodes.length,
              }));
            });

            const report = {
              layout,
              axeViolations: axe,
              consoleErrors: [...new Set(consoleErrors)].slice(0, 40),
              pageErrors: [...new Set(pageErrors)].slice(0, 40),
              failedRequests: failedRequests.slice(0, 40),
            };
            console.log(JSON.stringify(report, null, 2));
            fs.writeFileSync('audit-artifacts/browser-audit.json', JSON.stringify(report, null, 2));
            await page.screenshot({ path: 'audit-artifacts/homepage-mobile.png', fullPage: true });
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          npx --yes lighthouse@12.5.1 http://127.0.0.1:4173/v2/index.html \
            --chrome-path="$CHROME_BIN" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=audit-artifacts/lighthouse.json \
            --quiet
          lighthouse_status=$?
          echo "$lighthouse_status" > audit-artifacts/lighthouse.status
          if [ -s audit-artifacts/lighthouse.json ]; then
            node <<'NODE'
            const report = require('./audit-artifacts/lighthouse.json');
            const categories = Object.fromEntries(Object.entries(report.categories || {}).map(([key, value]) => [key, Math.round((value.score || 0) * 100)]));
            const failing = Object.values(report.audits || {})
              .filter((audit) => audit.score !== null && audit.score < 0.9 && ['binary', 'numeric'].includes(audit.scoreDisplayMode))
              .sort((a, b) => (a.score ?? 1) - (b.score ?? 1))
              .slice(0, 25)
              .map((audit) => ({ id: audit.id, title: audit.title, score: audit.score, displayValue: audit.displayValue }));
            console.log('Lighthouse categories:', categories);
            console.log('Lowest-scoring audits:', JSON.stringify(failing, null, 2));
            NODE
          fi
          exit 0

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-audit
          path: audit-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce build and type-check gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in npm-ci build typecheck; do
            file="audit-artifacts/${gate}.status"
            if [ ! -f "$file" ]; then
              echo "::error::$gate did not produce a status file"
              failed=1
              continue
            fi
            status="$(cat "$file")"
            if [ "$status" != "0" ]; then
              echo "::error::$gate failed with exit code $status"
              failed=1
            else
              echo "$gate passed"
            fi
          done
          exit "$failed"
