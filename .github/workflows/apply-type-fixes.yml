name: Apply audited TypeScript fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'audit/production-hardening-2026-07-10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply verified patch and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git apply --check scripts/production-audit/type-fixes.patch
          git apply scripts/production-audit/type-fixes.patch
          rm scripts/production-audit/type-fixes.patch
          rm .github/workflows/apply-type-fixes.yml

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Noteworthy Production Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(types): restore strict TypeScript health"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
