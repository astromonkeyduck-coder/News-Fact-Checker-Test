    <script src="/lib/contentNormalize.js?v=20260705"></script>
    <script type="module">
        import { initPostMedia, mediaHtml } from '/v2/js/post-media.js?v=20260705';

        const PAGE_SIZE = 24;
        const grid = document.getElementById('archive-grid');
        const chipsEl = document.getElementById('categoryChips');
        const countEl = document.getElementById('arch-count');
        const subEl = document.getElementById('arch-sub');
        const moreBtn = document.getElementById('load-more');

        let allPosts = [];
        let visibleCount = PAGE_SIZE;
        let activeCategory = '';

        const cn = window.ContentNormalize;

        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function relTime(raw) {
            if (!raw) return '';
            const d = new Date(raw);
            if (isNaN(d.getTime())) return '';
            const mins = Math.floor((Date.now() - d.getTime()) / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + 'h ago';
            const days = Math.floor(hours / 24);
            if (days < 7) return days + 'd ago';
            const opts = { month: 'short', day: 'numeric' };
            if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
            return d.toLocaleDateString('en-US', opts);
        }

        function title(post) {
            const raw = (cn && cn.cleanHeadline) ? cn.cleanHeadline(post) : (post.title || post.text || 'Untitled');
            // Volcano engine titles arrive as "WATCH - Great Sitkin"; rewrite
            // them into readable headlines the same way the homepage does.
            if (String(post.category || '').toLowerCase().includes('volcano')) {
                const m = raw.match(/^(WATCH|WARNING|ADVISORY)\s*[-:|]\s*(.+)$/i);
                if (m) return 'Volcano ' + m[1].toLowerCase() + ' in effect for ' + m[2].trim();
            }
            return raw;
        }

        function excerpt(post) {
            const raw = (cn && cn.normalizeSocialPostText)
                ? cn.normalizeSocialPostText(post.story || post.text || '')
                : (post.story || post.text || '');
            const t = title(post).toLowerCase();
            const clean = raw.replace(/\s+/g, ' ').trim();
            if (!clean || clean.toLowerCase().startsWith(t.slice(0, 60).toLowerCase())) return '';
            return clean.length > 160 ? clean.slice(0, 157) + '\u2026' : clean;
        }

        function category(post) {
            if (post.category) return post.category;
            const src = (post.source || '').toLowerCase();
            if (src.includes('usgs')) return 'Earthquake';
            if (src.includes('nws')) return 'Weather';
            if (src.includes('faa')) return 'Aviation';
            return 'News';
        }

        function format(post) {
            const media = (cn && cn.getPrimaryMedia) ? cn.getPrimaryMedia(post) : { type: null };
            if (media.type === 'video') return 'video';
            if (media.type === 'image') return 'photo';
            return 'text';
        }

        function postDate(post) {
            return new Date(post.datePosted || post.createdAt || post.created_at || 0);
        }

        function cardHtml(post, i) {
            const id = post.id || post.postId || '';
            const url = '/article.html?id=' + encodeURIComponent(id);
            const heading = title(post);
            const short = heading.length > 110 ? heading.slice(0, 107).trim() + '\u2026' : heading;
            const ex = excerpt(post);
            const when = relTime(post.datePosted || post.createdAt || post.created_at);
            const cat = category(post);
            const fmt = format(post);
            const read = post.readTime ? post.readTime + ' min' : '';

            let mediaBlock = '';
            if (cn && cn.getPrimaryMedia) {
                const media = cn.getPrimaryMedia(post);
                if (media.type === 'video') {
                    mediaBlock = mediaHtml({ videoSrc: media.url, image: media.poster, alt: short }, esc);
                } else if (media.type === 'image') {
                    mediaBlock = mediaHtml({ image: media.url, alt: short, href: url }, esc);
                }
            }

            const metaBits = [
                '<span>' + esc(cat) + '</span>',
                when ? '<span class="sep" aria-hidden="true">&middot;</span><span>' + esc(when) + '</span>' : '',
                fmt === 'video' ? '<span class="sep" aria-hidden="true">&middot;</span><span>Video</span>' : '',
                read && fmt === 'text' ? '<span class="sep" aria-hidden="true">&middot;</span><span>' + esc(read) + '</span>' : ''
            ].join('');

            return '<article class="next-card">' +
                mediaBlock +
                '<div class="next-card-body">' +
                    '<a class="next-card-link" href="' + esc(url) + '"><h2 class="next-card-title">' + esc(short) + '</h2></a>' +
                    (ex ? '<p class="arch-card-excerpt">' + esc(ex) + '</p>' : '') +
                    '<div class="arch-card-meta">' + metaBits + '</div>' +
                '</div>' +
            '</article>';
        }

        function filtered() {
            const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const type = document.getElementById('typeFilter').value;
            const sort = document.getElementById('sortFilter').value;

            let list = allPosts.filter(post => {
                if (activeCategory && category(post) !== activeCategory) return false;
                if (type && format(post) !== type) return false;
                if (q) {
                    const hay = (title(post) + ' ' + (post.story || post.text || '')).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            list.sort((a, b) => sort === 'oldest' ? postDate(a) - postDate(b) : postDate(b) - postDate(a));
            return list;
        }

        function renderChips() {
            const counts = {};
            allPosts.forEach(p => {
                const c = category(p);
                counts[c] = (counts[c] || 0) + 1;
            });
            const cats = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7);

            chipsEl.innerHTML =
                '<button type="button" class="arch-chip is-active" data-cat="">All<span class="count">' + allPosts.length + '</span></button>' +
                cats.map(([cat, n]) =>
                    '<button type="button" class="arch-chip" data-cat="' + esc(cat) + '">' + esc(cat) + '<span class="count">' + n + '</span></button>'
                ).join('');

            chipsEl.addEventListener('click', (e) => {
                const chip = e.target.closest('.arch-chip');
                if (!chip) return;
                activeCategory = chip.dataset.cat || '';
                visibleCount = PAGE_SIZE;
                chipsEl.querySelectorAll('.arch-chip').forEach(c =>
                    c.classList.toggle('is-active', c === chip)
                );
                render();
            });
        }

        function render() {
            const list = filtered();
            const shown = list.slice(0, visibleCount);

            if (shown.length === 0) {
                grid.innerHTML = '<div class="nn-state" style="grid-column:1/-1;max-width:none">' +
                    '<p class="nn-state-title">No stories match</p>' +
                    '<p class="nn-state-text">Try a different search or clear the filters.</p>' +
                    '<div class="nn-state-actions"><button type="button" class="utility-btn utility-btn--primary" id="clear-filters">Clear filters</button></div>' +
                '</div>';
                const clear = document.getElementById('clear-filters');
                if (clear) clear.addEventListener('click', resetFilters);
                countEl.textContent = '';
                moreBtn.hidden = true;
                return;
            }

            grid.innerHTML = shown.map(cardHtml).join('');
            initPostMedia(grid);

            const remaining = list.length - shown.length;
            countEl.textContent = 'Showing ' + shown.length + ' of ' + list.length + ' stories';
            moreBtn.hidden = remaining <= 0;
            if (remaining > 0) moreBtn.textContent = 'Load more stories (' + remaining + ')';
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('sortFilter').value = 'newest';
            activeCategory = '';
            visibleCount = PAGE_SIZE;
            chipsEl.querySelectorAll('.arch-chip').forEach(c =>
                c.classList.toggle('is-active', !c.dataset.cat)
            );
            render();
        }

        async function load() {
            try {
                const res = await fetch('/.netlify/functions/posts-read?limit=200');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const posts = await res.json();
                if (!Array.isArray(posts)) throw new Error('Bad response');

                allPosts = posts;
                if (allPosts.length === 0) {
                    grid.innerHTML = '<div class="nn-state" style="grid-column:1/-1;max-width:none">' +
                        '<p class="nn-state-title">Nothing here yet</p>' +
                        '<p class="nn-state-text">New stories land on the front page first, then archive here.</p>' +
                        '<div class="nn-state-actions"><a class="utility-btn utility-btn--primary" href="/">Front page</a></div>' +
                    '</div>';
                    return;
                }

                subEl.textContent = allPosts.length + ' stories, newest first.';
                renderChips();
                render();
            } catch (err) {
                console.error('[Archive]', err);
                grid.innerHTML = '<div class="nn-state" style="grid-column:1/-1;max-width:none">' +
                    '<p class="nn-state-title">Could not load stories</p>' +
                    '<p class="nn-state-text">Check your connection and try again in a moment.</p>' +
                    '<div class="nn-state-actions"><button type="button" class="utility-btn utility-btn--primary" onclick="location.reload()">Try again</button></div>' +
                '</div>';
            }
        }

        let searchTimer = null;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => { visibleCount = PAGE_SIZE; render(); }, 160);
        });
        document.getElementById('typeFilter').addEventListener('change', () => { visibleCount = PAGE_SIZE; render(); });
        document.getElementById('sortFilter').addEventListener('change', () => { visibleCount = PAGE_SIZE; render(); });
        moreBtn.addEventListener('click', () => { visibleCount += PAGE_SIZE; render(); });

        load();
    </script>
